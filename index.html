<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chaundoo Card Flipz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>:root{box-sizing:border-box}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="app-style">
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#eef1f7; --ink:#141b2d; --muted:#5d6782; --line:#dde2ec;
  --navy:#1b2540; --navy-ink:#ffffff; --gold:#e3a800; --gold-soft:#fff5d4; --gold-ink:#7a5a00;
  --pos:#16803c; --pos-soft:#e5f4ea; --neg:#b42323; --neg-soft:#fbe9e9; --est:#eceff5;
  --shadow:0 8px 24px rgba(20,27,45,.12);
  --pop10:#d99c00; --pop9:#3b6fd8; --poprest:#d5dbe6;
  --gain:#2a78d6; --loss:#e34948;
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1322; --surface:#161d30; --surface-2:#1d2640; --ink:#e8ecf6; --muted:#9aa4c0; --line:#2a3452;
    --navy:#243056; --navy-ink:#ffffff; --gold:#f0bd2a; --gold-soft:#3a3014; --gold-ink:#f6d677;
    --pos:#4fcf7d; --pos-soft:#15301f; --neg:#ff7a7a; --neg-soft:#3a1a1d; --est:#262f49;
    --shadow:0 8px 24px rgba(0,0,0,.4);
    --pop10:#b8870c; --pop9:#5b8cf0; --poprest:#2f3a5a;
    --gain:#3987e5; --loss:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1322; --surface:#161d30; --surface-2:#1d2640; --ink:#e8ecf6; --muted:#9aa4c0; --line:#2a3452;
  --navy:#243056; --navy-ink:#ffffff; --gold:#f0bd2a; --gold-soft:#3a3014; --gold-ink:#f6d677;
  --pos:#4fcf7d; --pos-soft:#15301f; --neg:#ff7a7a; --neg-soft:#3a1a1d; --est:#262f49;
  --shadow:0 8px 24px rgba(0,0,0,.4);
  --pop10:#b8870c; --pop9:#5b8cf0; --poprest:#2f3a5a;
    --gain:#3987e5; --loss:#e66767;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
#root{max-width:1180px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 0 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,var(--gold) 0 46%,var(--ink) 46% 54%,var(--surface) 54%);border:3px solid var(--ink);position:relative;flex:none}
.mark:after{content:"";position:absolute;inset:50% auto auto 50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.brand h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.settings{display:flex;flex-wrap:wrap;gap:8px}
.set-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;color:var(--muted)}
.set-chip input{width:62px;border:none;background:var(--surface-2);border-radius:5px;padding:3px 5px;text-align:right;color:var(--ink);font-weight:600}
.set-chip.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold-ink)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0}
.search{flex:1 1 220px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search input{border:none;background:transparent;padding:10px 4px;width:100%;outline:none}
.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--gold);color:#1b1400;border-color:transparent}
.btn.dark{background:var(--navy);color:var(--navy-ink);border-color:transparent}
.btn.danger{background:var(--neg);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.readonly-note{font-size:13px;color:var(--muted)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .art{aspect-ratio:63/88;border-radius:9px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center;max-width:100%}
.tile .art img{width:100%;height:100%;object-fit:cover;display:block}
.tile .art img:not([src]){visibility:hidden}
.more-row{display:flex;flex-direction:column;align-items:center;gap:8px;margin:22px 0 4px}
.more-row .btn{min-width:200px;padding:12px 20px}
.tile h3{font-size:17px;font-weight:700}
.sub{color:var(--muted);font-size:12.5px}
.tile .prices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv{background:var(--surface-2);border-radius:7px;padding:6px 8px}
.kv span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kv b{font-size:15px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.v-grade{background:var(--pos-soft);color:var(--pos)}
.pill.v-sel{background:var(--gold-soft);color:var(--gold-ink)}
.pill.v-no{background:var(--neg-soft);color:var(--neg)}
.pill.v-hold{background:var(--est);color:var(--muted)}
.pill.pos{background:var(--pos-soft);color:var(--pos)}
.pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.est{background:var(--est);color:var(--muted);font-weight:600}
.profit-kv b{margin-right:4px}
.profit-kv .pill{display:inline-block;text-transform:none;letter-spacing:0;font-size:11px}
.popbox{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px}
.pophead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.pophead span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.pophead small{font-size:12px;color:var(--muted)}
.popgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.popcard{border-radius:10px;background:var(--surface-2);padding:12px}
.popcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.popcard-top b{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:.02em}
.popcard-top span{font-size:12.5px;color:var(--muted)}
.pop-hero{margin:6px 0 10px;font-size:13.5px}
.pop-hero b{font-family:var(--display);font-size:26px;font-weight:800;margin-right:4px;font-variant-numeric:tabular-nums}
.popbar{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;background:var(--surface)}
.popbar i{display:block;height:100%;min-width:3px}
.popbar .s10{background:var(--pop10)} .popbar .s9{background:var(--pop9)} .popbar .srest{background:var(--poprest);flex:1 1 auto}
.poplegend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.poplegend div{font-size:11.5px;color:var(--muted);line-height:1.3}
.poplegend div b{display:block;color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.poplegend em{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0;font-style:normal}
.poplegend .k10{background:var(--pop10)} .poplegend .k9{background:var(--pop9)} .poplegend .krest{background:var(--poprest)}
.popcard.none{display:flex;flex-direction:column;justify-content:center;gap:4px;color:var(--muted);font-size:13px;background:transparent;border:1px dashed var(--line)}
.popcard.none b{color:var(--ink);font-family:var(--display);font-size:18px}
.flipline{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin-top:5px;padding:5px 7px;border-radius:6px}
.flipline .fl-route{flex:1 0 100%}
.flipline.best{background:var(--surface)}
.flipline .fl-route{font-size:11.5px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600;line-height:1.25}
.flipline .fl-route em{font-style:normal;color:var(--muted);opacity:.8}
.flipline b{font-size:15px}
.flipline .pill{font-size:10.5px;padding:2px 6px}
.gapbar{height:6px;border-radius:99px;background:var(--surface);margin-top:7px;overflow:hidden}
.gapbar i{display:block;height:100%;border-radius:99px;background:var(--pos)}
.gapkv.warn .gapbar i{background:var(--gold)} .gapkv.neg .gapbar i{background:var(--neg)}
.bekv b{font-size:17px;margin-right:4px}
.bekv .pill{display:inline-block;text-transform:none;letter-spacing:0;font-size:11px}
.bekv.none b{font-size:13px;color:var(--muted)}
.conds{display:flex;flex-wrap:wrap;gap:4px}
.conds span{background:var(--surface-2);border-radius:6px;padding:3px 6px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.conds i{font-style:normal;font-size:10px;letter-spacing:.06em;color:var(--muted);margin-right:2px}
.bestflip{border-radius:10px;padding:9px 10px;background:var(--pos-soft)}
.bestflip.warn{background:var(--gold-soft)} .bestflip.neg,.bestflip.none{background:var(--surface-2)}
.bestflip .lbl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.bf-main{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.bf-main b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.bestflip.pos .bf-main b{color:var(--pos)} .bestflip.warn .bf-main b{color:var(--gold-ink)} .bestflip.neg .bf-main b{color:var(--neg)}
.bestflip.none b{font-size:13px;color:var(--muted)}
.bf-route{font-size:12.5px;font-weight:600;margin-top:3px}
.bf-route em{font-style:normal;color:var(--muted);font-weight:500}
.advbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.advbtn i{width:32px;height:18px;border-radius:99px;background:var(--poprest);position:relative;flex:none;transition:background .15s}
.advbtn i:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.advbtn[aria-checked="true"]{color:var(--ink)}
.advbtn[aria-checked="true"] i{background:var(--pos)}
.advbtn[aria-checked="true"] i:after{left:16px}
tr.bestrow td{background:color-mix(in srgb,var(--pos-soft) 70%,transparent)}
.prow2.bestrow{background:color-mix(in srgb,var(--pos-soft) 60%,transparent)}
.poptile{margin-top:-4px;display:flex;align-items:center;gap:5px}
.poptile em{width:8px;height:8px;border-radius:2px;background:var(--pop10);flex:none}
.storage{margin-top:36px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px;color:var(--muted)}
.storage-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;margin-bottom:8px}
.storage-row b{color:var(--ink)}
.meter{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--pos)}
.meter.warn i{background:var(--gold)}
.meter.full i{background:var(--neg)}
.storage p{margin:8px 0 0}
.tile-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border-radius:14px;border:1px dashed var(--line)}

/* detail */
.back{margin:16px 0 8px}
.detail-head{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
.detail-head .art{border-radius:12px;overflow:hidden;box-shadow:var(--shadow);max-width:100%}
.detail-head .art img{display:block;width:100%}
.title-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.title-row h2{font-size:34px;font-weight:800;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--display);font-size:24px;font-weight:800}
.kpi small{display:block;color:var(--muted);font-size:12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.fact span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:2px}
section.block{margin-top:26px}
section.block h3{font-size:13px;font-family:var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
td.g{font-weight:700;white-space:nowrap}
th.v{background:var(--gold-soft);color:var(--gold-ink)}
td.v{background:color-mix(in srgb,var(--gold-soft) 55%,transparent)}
.pos-t{color:var(--pos);font-weight:700}.neg-t{color:var(--neg);font-weight:700}
.verdict{margin-top:14px;background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:14px 16px}
.verdict .tag{display:inline-block;background:var(--gold);color:#1b1400;font-weight:800;padding:3px 9px;border-radius:5px;margin-right:8px;font-size:13px}
.verdict p{margin:8px 0 0;opacity:.88}
.note{font-size:12.5px;color:var(--muted);margin-top:6px}
.tcglink{color:var(--pop9);font-weight:600;text-decoration:none;white-space:nowrap}
.tcglink:hover{text-decoration:underline}

/* editor */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,26,.55);display:flex;justify-content:flex-end;z-index:20}
.sheet{background:var(--bg);width:min(720px,100%);height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 90px)}
.sheet h2{font-size:24px;font-weight:800;margin-bottom:4px}
fieldset{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;margin:14px 0 0}
legend{font-weight:700;font-size:13px;padding:0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px;color:var(--ink);font-weight:400;font-size:14px}
label.f textarea{min-height:64px;resize:vertical}
.prow{display:grid;grid-template-columns:110px 100px 1fr 120px 56px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow.g{grid-template-columns:110px 100px 1fr 56px}
.prow b{font-size:13px}
.prow input{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 8px;width:100%;min-width:0}
.prow .chk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.phead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.drop{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.drop .preview{width:110px;aspect-ratio:63/88;border-radius:8px;border:2px dashed var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center;padding:4px;flex:none}
.drop .preview img{width:100%;height:100%;object-fit:cover}
.sheet-actions{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);padding:14px 0;margin-top:16px;border-top:1px solid var(--line)}
.msg{font-size:13px}
.msg.err{color:var(--neg)} .msg.ok{color:var(--pos)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

@media (max-width:700px){
  .detail-head{grid-template-columns:1fr}
  .detail-head .art{width:200px;margin:0 auto}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .facts{grid-template-columns:1fr}
  .title-row h2{font-size:28px}
  .prow,.prow.g{grid-template-columns:1fr 1fr}
  .prow b{grid-column:1/-1}
  .phead{display:none}
}
/* view chooser */
.chooser-bg{position:fixed;inset:0;background:rgba(10,14,26,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.chooser{background:var(--surface);border-radius:16px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow);text-align:center}
.chooser h2{font-size:22px;font-weight:800;margin-bottom:6px}
.chooser p{margin:0 0 16px;color:var(--muted);font-size:14px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;font-size:16px}
.choice.suggest{border-color:var(--gold)}
.choice small{font-weight:500;color:var(--muted);font-size:12px}
.ico-desk{width:52px;height:34px;border:3px solid var(--ink);border-radius:4px;position:relative;margin-bottom:6px}
.ico-desk:after{content:"";position:absolute;left:14px;right:14px;bottom:-9px;height:4px;background:var(--ink);border-radius:2px}
.ico-phone{width:24px;height:42px;border:3px solid var(--ink);border-radius:6px;position:relative}
.ico-phone:after{content:"";position:absolute;left:50%;bottom:3px;width:6px;height:3px;margin-left:-3px;background:var(--ink);border-radius:2px}
.viewbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted);font-weight:600}
.fees{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0}
.fees summary{padding:10px 12px;font-size:14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.fees summary::-webkit-details-marker{display:none}
.fees[open] summary{border-bottom:1px solid var(--line)}
.fees .settings{padding:10px 12px}
.plist{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.prow2{padding:12px 14px;border-bottom:1px solid var(--line)}
.prow2:last-child{border-bottom:none}
.prow2 .top2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prow2 .top2 b{font-size:16px}
.prow2 .top2 .price{font-family:var(--display);font-size:20px;font-weight:800}
.prow2 .meta{font-size:13px;color:var(--muted);margin-top:2px}
.prow2 .nets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.prow2 .net{border-radius:9px;padding:8px 10px;background:var(--surface-2)}
.prow2 .net.v{background:var(--gold-soft)}

function field(id,label,val,ph){ return '<label class="f">'+label+'<input id="'+id+'" value="'+esc(val)+'" placeholder="'+esc(ph||"")+'"></label>'; }
function readImage(file){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var w = Math.min(200, img.naturalWidth), h = Math.round(img.naturalHeight*w/img.naturalWidth);
      var cv = document.createElement("canvas"); cv.width=w; cv.height=h;
      var ctx = cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      state.editing.image = cv.toDataURL("image/jpeg",0.6);
      document.getElementById("pv").innerHTML = '<img src="'+state.editing.image+'" alt="">';
    };
    img.onerror = function(){ setMsg("That file isn't an image this browser can read. Try a JPG or PNG.","err"); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function val(id){ var el=document.getElementById(id); return el? el.value.trim() : ""; }
function num(id){ var v = parseFloat(val(id)); return isNaN(v) ? "" : v; }
function chk(id){ var el=document.getElementById(id); return !!(el&&el.checked); }
function collect(){
  var e = state.editing;
  e.name=val("f-name"); e.variant=val("f-variant"); e.set=val("f-set"); e.number=val("f-number"); e.updated=val("f-updated");
  if(document.getElementById("f-era")) e.era = val("f-era") || guessEra(e.set); else if(!e.era) e.era = guessEra(e.set);
  var tm = /product\/(\d+)/.exec(val("f-tcg")) || /^(\d+)$/.exec(val("f-tcg")); if(tm) e.tcgId = Number(tm[1]); else if(!val("f-tcg")) delete e.tcgId;
  RAW.forEach(function(r){ e.raw[r[0]]={price:num("r-"+r[0]+"-price"),src:val("r-"+r[0]+"-src"),date:val("r-"+r[0]+"-date"),est:chk("r-"+r[0]+"-est")}; });
  GRADED.forEach(function(g){ e.graded[g[0]]={price:num("g-"+g[0]+"-price"),src:val("g-"+g[0]+"-src"),est:chk("g-"+g[0]+"-est")}; });
  var np = {}, anyPop = false;
  ["psa10","psa9","psaTotal","cgc10","cgc9","cgcTotal"].forEach(function(k){ var v = num("p-"+k); np[k] = v==="" ? null : Math.round(v); if(np[k]!=null) anyPop = true; });
  np.src = val("p-src");
  var old = e.pop || {}, changed = ["psa10","psa9","psaTotal","cgc10","cgc9","cgcTotal"].some(function(k){ return (old[k]==null?null:old[k]) !== np[k]; });
  np.date = changed ? new Date().toISOString().slice(0,10) : (old.date || "");
  if(anyPop) e.pop = np; else delete e.pop;
  e.gem=val("f-gem"); e.liquidity=val("f-liq"); e.verdict=val("f-verdict"); e.notes=val("f-notes");
  return e;
}
function setMsg(t,type){ state.msg=t; state.msgType=type||""; var m=document.getElementById("msg"); if(m){ m.textContent=t; m.className="msg "+(type||""); } }
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60) || "card"; }
/* Duplicate guard: same name + set + card number (+ variant) = same card, ignoring case, spacing, punctuation and leading zeros. */
function normTxt(s){ return String(s||"").toLowerCase().replace(/pok[eé]mon/g,"").replace(/\b(holo rare|holo)\b/g,"holo").replace(/[^a-z0-9]+/g,""); }
function normNum(s){ var p=String(s||"").toLowerCase().split("/")[0].replace(/[^a-z0-9]/g,""); return p.replace(/^([a-z]*)0+(?=\d)/,"$1"); }
function cardKey(c){ return [normTxt(c.name), normTxt(c.set), normNum(c.number), normTxt(c.variant)].join("|"); }
function findDuplicate(e, skipId){
  var k = cardKey(e);
  for(var i=0;i<cards.length;i++){ var c=cards[i]; if(c.id!==skipId && cardKey(c)===k) return c; }
  return null;
}
function doSave(){
  var e = collect();
  if(!e.name){ setMsg("Add a card name before saving.","err"); return; }
  if(!e.set){ setMsg("Add the set name before saving.","err"); return; }
  if(!(Number(e.raw.nm.price)>0)){ setMsg("Add a Near Mint price. It's the buy price for every profit calculation.","err"); return; }
  var dup = findDuplicate(e, state.isNew ? null : e.id);
  if(dup){
    setMsg("This card is already in the tracker: "+dup.name+(dup.variant?" ("+dup.variant+")":"")+" · "+dup.set+" "+(dup.number||"")+". It wasn't added again. ","err");
    var m=document.getElementById("msg");
    if(m){ var a=document.createElement("button"); a.type="button"; a.className="btn ghost"; a.style.padding="2px 6px"; a.textContent="Open existing card";
      a.onclick=function(){ closeEditor(); go(dup.id); }; m.appendChild(a); }
    return;
  }
  var next = cards.slice();
  if(state.isNew){
    var base = slug(e.name+"-"+e.variant+"-"+e.number), id = base, n = 2;
    while(next.some(function(c){return c.id===id;})) id = base+"-"+(n++);
    e.id = id; next.push(e);
  } else {
    next = next.map(function(c){ return c.id===e.id ? e : c; });
  }
  publishCards(next, e.id);
}
function doDelete(){ var id = state.editing.id; publishCards(cards.filter(function(c){return c.id!==id;}), null); }

function buildDoc(list){
  var style = document.getElementById("app-style").textContent;
  var js = document.getElementById("app-js").textContent;
  var fonts = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">';
  var json = JSON.stringify({cards:list, pairings:sharedPairs()}).replace(/</g,"\\u003c");
  var S1 = "<scr"+"ipt", S2 = "</scr"+"ipt>";
  return SKEL + '<title>Chaundoo Card Flipz</title>\n' + fonts + '\n<style id="app-style">' + style + '</style>\n<div id="root"></div>\n' +
    S1 + ' type="application/json" id="app-data">' + json + S2 + '\n' + S1 + ' id="app-js">' + js + S2 + '\n</body></html>';
}
function publishCards(list, openId){
  if(!artifactApi){ setMsg("Saving isn't available in this view.","err"); return; }
  state.saving = true; var b=document.getElementById("savebtn"); if(b){ b.disabled=true; b.textContent="Saving…"; }
  setMsg("Saving…","");
  try{ sessionStorage.setItem("flipdesk.open", openId||""); }catch(err){}
  artifactApi.publish(buildDoc(list)).then(function(){
    state.published = true; state.dirty = false;
    setMsg("Saved. Reloading…","ok");
  }).catch(function(err){
    state.saving=false; if(b){ b.disabled=false; b.textContent="Save card"; }
    var code = err && err.code;
    if(code==="conflict") setMsg("Someone else just saved a change. The page is reloading with their version; re-enter your edit after it loads.","err");
    else if(code==="not_writer"||code==="not_granted"||code==="consent_required"||code==="capability_disabled"||code==="not_declared"){ canWrite=false; setMsg("You have view-only access, so this can't be saved. Ask the owner for edit access.","err"); }
    else if(code==="too_large") setMsg("The tracker is too big to save. Use a smaller image or remove a card.","err");
    else if(code==="rate_limited") setMsg("Too many saves in a row. Wait a minute, then save again.","err");
    else setMsg("Couldn't save right now. Check your connection and try again.","err");
  });
}

/* ---------- card pairings (batch selling to a vendor) ---------- */
var CONDS = [["nm","NM"],["lp","LP"],["mp","MP"],["dmg","DMG"]];
var pairs = [], selected = [];
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function strip(p){ var q = clone(p); delete q.local; return q; }
function sharedPairs(){ return pairs.filter(function(p){ return !p.local; }).map(strip); }
function saveLocalPairs(){ save("flipdesk.localpairs", pairs.filter(function(p){ return p.local; }).map(strip)); }
function localPairsFromStore(){ var l = load("flipdesk.localpairs", []); if(!Array.isArray(l)) l = []; l.forEach(function(p){ p.local = true; if(!Array.isArray(p.items)) p.items = []; }); return l; }
function initPairs(){
  var shared = (DATA.pairings||[]).map(clone);
  try{ var d = sessionStorage.getItem("flipdesk.pairdraft"); if(d){ sessionStorage.removeItem("flipdesk.pairdraft"); var dp = JSON.parse(d); if(Array.isArray(dp)){ shared = dp; state.dirty = true; } } }catch(e){}
  pairs = shared.concat(localPairsFromStore());
}
function keepDraft(){ if(state.dirty && !state.published){ try{ sessionStorage.setItem("flipdesk.pairdraft", JSON.stringify(sharedPairs())); }catch(e){} } }
window.addEventListener("pagehide", keepDraft);
window.addEventListener("beforeunload", keepDraft);
function cardById(id){ for(var i=0;i<cards.length;i++){ if(cards[i].id===id) return cards[i]; } return null; }
function pairById(id){ for(var i=0;i<pairs.length;i++){ if(pairs[i].id===id) return pairs[i]; } return null; }
function priceAt(c,k){ var x = c && c.raw && c.raw[k]; var v = x && Number(x.price); return v>0 ? v : 0; }
function localOnly(){ return canWrite===false || (apiChecked && !artifactApi); }
function newPairing(){
  var d = new Date();
  var p = {id:"p"+Date.now().toString(36)+Math.floor(Math.random()*1000), name:"Batch "+(d.getMonth()+1)+"/"+d.getDate(), created:d.toISOString().slice(0,10), items:[]};
  if(localOnly()) p.local = true;
  pairs.unshift(p); return p;
}
/* New cards start on their best vendor flip: bought one condition down, sold one step up. */
function defaultItem(c){ var g = condGap(c,"vendor"); return {cardId:c.id, bought:g?g.best.fk:"nm", sellAs:g?g.best.tk:"nm", paid:""}; }
function itemCalc(it){
  var c = cardById(it.cardId); if(!c) return {missing:true};
  var mv = priceAt(c, it.sellAs), mkt = priceAt(c, it.bought);
  var hasPaid = it.paid!=="" && it.paid!=null && !isNaN(Number(it.paid));
  var cost = hasPaid ? Number(it.paid) : mkt;
  var payout = mv*S.vendor/100;
  return {c:c, mv:mv, mkt:mkt, cost:cost, payout:payout, profit:payout-cost, ebayProfit:mv*(1-S.ebay/100)-cost, noPrice:!(mv>0) || !(cost>0 || hasPaid)};
}
function pairTotals(p){
  var t = {n:0, mv:0, cost:0, payout:0, profit:0, ebayProfit:0, gaps:0};
  p.items.forEach(function(it){ var r = itemCalc(it); if(r.missing || r.noPrice){ t.gaps++; return; } t.n++; t.mv+=r.mv; t.cost+=r.cost; t.payout+=r.payout; t.profit+=r.profit; t.ebayProfit+=r.ebayProfit; });
  t.roi = t.cost ? t.profit/t.cost*100 : 0; return t;
}
function changed(p){ if(p.local) saveLocalPairs(); else state.dirty = true; }
function addCards(target, ids){
  var p = target==="__new" || !target ? newPairing() : pairById(target);
  if(!p) p = newPairing();
  ids.forEach(function(id){ var c = cardById(id); if(c) p.items.push(defaultItem(c)); });
  changed(p); return p;
}
function tabs(){
  var v = state.view, cur = (v==="pairings"||v==="pairing") ? "pairs" : (v==="log"||v==="show") ? "log" : "cards";
  function t(id, label, extra){ return '<button class="tab'+(cur===id?' on':'')+'" id="tab-'+id+'"'+(cur===id?' aria-current="page"':'')+'>'+label+(extra||'')+'</button>'; }
  return '<nav class="tabs" aria-label="Sections">'+t("cards","Cards")+t("pairs","Card Pairings", pairs.length?'<span class="count">'+pairs.length+'</span>':'')+t("log","Profit Log")+'</nav>';
}
function goPairs(pid){ state.view = pid ? "pairing" : "pairings"; state.pid = pid||null; state.confirmPairDel = false; state.selecting = false; selected = []; try{ history.replaceState(null,"","#"+(pid?"pairing:"+pid:"pairings")); }catch(e){} window.scrollTo(0,0); render(); }

/* bottom bar: card selection, or unsaved shared pairing changes */
function selectBar(){
  return '<div class="actionbar" role="region" aria-label="Selected cards"><b id="sel-count">'+selected.length+' selected</b>'+
    '<select id="sel-target" aria-label="Add to which pairing"><option value="__new">New pairing</option>'+pairs.map(function(p){ return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>'; }).join("")+'</select>'+
    '<button class="btn primary" id="sel-add"'+(selected.length?'':' disabled')+'>Add to pairing</button><button class="btn" id="sel-cancel">Cancel</button></div>';
}
function pairBar(){
  if(state.selecting && state.view==="list") return selectBar();
  if(!state.dirty) return '';
  var dis = state.pairSaving ? ' disabled' : '';
  return '<div class="actionbar" role="region" aria-label="Unsaved pairing changes"><b>Unsaved pairing changes</b>'+
    '<button class="btn" id="pb-discard"'+dis+'>Discard</button><button class="btn primary" id="pb-save"'+dis+'>'+(state.pairSaving?'Saving…':'Save pairings')+'</button>'+
    (state.pairMsg?'<span class="msg" role="status">'+esc(state.pairMsg)+'</span>':'')+'</div>';
}
function mountBar(){
  var old = document.querySelector(".actionbar"); if(old) old.remove();
  var html = pairBar(); document.body.classList.toggle("has-bar", !!html);
  if(!html) return;
  var w = document.createElement("div"); w.innerHTML = html; var bar = w.firstChild; document.body.appendChild(bar);
  var sa = document.getElementById("sel-add"); if(sa) sa.addEventListener("click", function(){
    if(!selected.length) return; var p = addCards(document.getElementById("sel-target").value, selected.slice()); goPairs(p.id); });
  var sc = document.getElementById("sel-cancel"); if(sc) sc.addEventListener("click", function(){ state.selecting = false; selected = []; render(); });
  var ps = document.getElementById("pb-save"); if(ps) ps.addEventListener("click", savePairs);
  var pd = document.getElementById("pb-discard"); if(pd) pd.addEventListener("click", function(){
    pairs = (DATA.pairings||[]).map(clone).concat(localPairsFromStore()); state.dirty = false; state.pairMsg = "";
    if(state.view==="pairing" && !pairById(state.pid)) state.view = "pairings"; render(); });
}
function savePairs(){
  if(!artifactApi){ denied(); return; }
  state.pairSaving = true; state.pairMsg = "Saving…"; mountBar();
  try{ sessionStorage.setItem("flipdesk.open", state.view==="pairing" ? "pairing:"+state.pid : state.view==="pairings" ? "pairings" : (state.view==="detail" ? state.id : "")); }catch(e){}
  artifactApi.publish(buildDoc(cards)).then(function(){ state.published = true; state.pairMsg = "Saved. Reloading…"; mountBar(); })
  .catch(function(err){
    state.pairSaving = false; var code = err && err.code;
    if(code==="not_writer"||code==="not_granted"||code==="consent_required"||code==="capability_disabled"||code==="not_declared"){ canWrite = false; denied(); return; }
    state.pairMsg = code==="conflict" ? "Someone else just saved a change. The page is reloading with their version; your pairing changes are kept." :
      code==="rate_limited" ? "Too many saves in a row. Wait a minute, then save again." :
      code==="too_large" ? "The tracker is too big to save. Remove a card image or two." : "Couldn't save right now. Check your connection and try again.";
    mountBar();
  });
}
/* View-only visitors: keep their new pairings on this device instead. */
function denied(){
  var sharedIds = (DATA.pairings||[]).map(function(p){ return p.id; });
  pairs.forEach(function(p){ if(!p.local && sharedIds.indexOf(p.id)<0) p.local = true; });
  var locals = pairs.filter(function(p){ return p.local; });
  pairs = (DATA.pairings||[]).map(clone).concat(locals); saveLocalPairs();
  state.dirty = false; state.pairMsg = "";
  state.notice = "You have view-only access, so shared pairings can't be changed. Your new pairings are saved on this device only.";
  if(state.view==="pairing" && !pairById(state.pid)) state.view = "pairings";
  render();
}

function renderPairings(){
  var h = header();
  h += '<div class="pair-intro"><div><h2>Card Pairings</h2><p class="sub">Group the cards you plan to sell together to a vendor at a show or shop, and see what the whole batch pays. Totals use the vendor rate at the top ('+S.vendor+'%).</p></div><button class="btn primary" id="newpair">+ New pairing</button></div>';
  if(state.notice) h += '<p class="notice" role="status">'+esc(state.notice)+'</p>';
  if(!pairs.length) h += '<div class="empty">No pairings yet. Open <b>Cards</b>, tap <b>Select cards</b>, pick the cards you’re selling together, then add them to a new pairing.</div>';
  else h += '<div class="pgrid">'+pairs.map(function(p){
    var t = pairTotals(p);
    var thumbs = p.items.slice(0,6).map(function(it){ var c = cardById(it.cardId); return '<span class="pthumb">'+(c&&c.image?'<img src="'+c.image+'" alt="">':'')+'</span>'; }).join("");
    return '<button class="ptile" data-pair="'+esc(p.id)+'"><div class="pthumbs">'+(thumbs||'<span class="sub">No cards yet</span>')+'</div>'+
      '<div><h3>'+esc(p.name)+'</h3><div class="sub">'+p.items.length+' card'+(p.items.length===1?'':'s')+(p.local?' · saved on this device':'')+'</div></div>'+
      '<div class="bf-main"><b class="num '+(t.profit>=0?'pos-t':'neg-t')+'">'+signed(t.profit)+'</b><span class="sub">batch profit</span></div>'+
      '<div class="sub">Vendor pays <b class="num" style="color:var(--ink)">'+money(t.payout,0)+'</b> for '+money(t.mv,0)+' of market value</div></button>'; }).join("")+'</div>';
  root.innerHTML = h; bindHeader();
  document.getElementById("newpair").addEventListener("click", function(){ var p = newPairing(); changed(p); goPairs(p.id); });
  root.querySelectorAll("[data-pair]").forEach(function(b){ b.addEventListener("click", function(){ goPairs(b.getAttribute("data-pair")); }); });
}
function condSel(i, field, val, c, label){
  return '<select class="csel" data-i="'+i+'" data-f="'+field+'" aria-label="'+label+'">'+CONDS.map(function(k){ var pr = priceAt(c,k[0]); return '<option value="'+k[0]+'"'+(k[0]===val?' selected':'')+'>'+k[1]+' · '+(pr?money(pr,0):'no price')+'</option>'; }).join("")+'</select>';
}

  var t = pairTotals(p), phone = VIEW==="phone";
  var h = header();

  } else {
    h += '<div class="tbl-wrap"><table class="pitems"><tr><th>Card</th><th>Bought as</th><th class="r">Paid</th><th>Sells as</th><th class="r">Market</th><th class="r v">Vendor pays</th><th class="r">Profit</th><th></th></tr>'+

  h += '<div class="padd"><label class="search"><span class="sub">Add a card</span><input id="padd-q" type="search" placeholder="Search your cards by name, set or number" autocomplete="off"></label><div class="padd-res" id="padd-res"></div></div>';
  root.innerHTML = h; bindHeader();
  document.getElementById("pback").addEventListener("click", function(){ goPairs(null); });

/* --- chart: one series (profit per show, or running total); gains blue above zero, losses red below --- */
function niceTicks(lo, hi){
  if(lo===hi){ hi = lo + 10; }
  var span = hi - lo, step = Math.pow(10, Math.floor(Math.log10(span/4))), err = span/4/step;
  step *= err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1;
  var a = Math.floor(lo/step)*step, b = Math.ceil(hi/step)*step, out = [];
  for(var v=a; v<=b+step/2; v+=step) out.push(Math.round(v*100)/100);
  return out;
}
function tickLabel(v){ var a = Math.abs(v); return (v<0?"−":"")+"$"+(a>=1000 ? (a/1000).toFixed(a%1000?1:0)+"k" : a); }
function drawChart(){
  var box = document.getElementById("pchart"); if(!box) return;
  var shows = sortedShows(true); if(!shows.length) return;
  var W = Math.max(280, box.clientWidth), H = 230, padL = 48, padR = 14, padT = 16, padB = 30, pw = W-padL-padR, ph = H-padT-padB;
  var run = 0, pts = shows.map(function(sh){ var s = showStats(sh); run += s.profit; return {sh:sh, s:s, v:chartMode==="run" ? run : s.profit}; });
  var lo = Math.min(0, Math.min.apply(null, pts.map(function(p){ return p.v; }))), hi = Math.max(0, Math.max.apply(null, pts.map(function(p){ return p.v; })));
  var ticks = niceTicks(lo, hi); lo = ticks[0]; hi = ticks[ticks.length-1];
  function y(v){ return padT + (hi - v)/(hi - lo)*ph; }
  var n = pts.length, band = pw/n, h = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(chartMode==="run"?"Running total of profit":"Profit for each card show")+'">';
  ticks.forEach(function(t){ var yy = Math.round(y(t))+0.5; h += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+yy+'" y2="'+yy+'" class="'+(t===0?'c-zero':'c-grid')+'"/><text x="'+(padL-8)+'" y="'+(yy+4)+'" class="c-tick" text-anchor="end">'+tickLabel(t)+'</text>'; });
  var every = Math.max(1, Math.ceil(n/7));
  pts.forEach(function(p,i){ var cx = padL + band*i + band/2;
    if(i % every === 0 || i === n-1){ var m = /^\d{4}-(\d{2})-(\d{2})$/.exec(p.sh.date||""); h += '<text x="'+cx+'" y="'+(H-10)+'" class="c-tick" text-anchor="middle">'+(m ? (+m[1])+"/"+(+m[2]) : "")+'</text>'; } });
  if(chartMode==="show"){
    var bw = Math.min(24, band*0.6), r = Math.min(4, bw/2), y0 = y(0);
    pts.forEach(function(p,i){ var x = padL + band*i + (band-bw)/2, yv = y(p.v), up = p.v >= 0, hgt = Math.abs(y0 - yv);
      if(hgt < 1) h += '<rect x="'+x+'" y="'+(y0-1)+'" width="'+bw+'" height="2" class="c-flat"/>';
      else { var rr = Math.min(r, hgt);
        h += up ? '<path class="c-gain" d="M'+x+','+y0+'V'+(yv+rr)+'Q'+x+','+yv+' '+(x+rr)+','+yv+'H'+(x+bw-rr)+'Q'+(x+bw)+','+yv+' '+(x+bw)+','+(yv+rr)+'V'+y0+'Z"/>'
                : '<path class="c-loss" d="M'+x+','+y0+'V'+(yv-rr)+'Q'+x+','+yv+' '+(x+rr)+','+yv+'H'+(x+bw-rr)+'Q'+(x+bw)+','+yv+' '+(x+bw)+','+(yv-rr)+'V'+y0+'Z"/>'; }
    });
    var last = pts[n-1], lx = padL + band*(n-1) + band/2, ly = y(last.v);
    h += '<text x="'+lx+'" y="'+(last.v>=0 ? ly-7 : ly+15)+'" class="c-label" text-anchor="middle">'+signed(last.v)+'</text>';
  } else {
    var xs = pts.map(function(p,i){ return padL + band*i + band/2; });
    var line = pts.map(function(p,i){ return (i?'L':'M')+xs[i]+','+y(p.v); }).join('');
    h += '<path class="c-area" d="'+line+'L'+xs[n-1]+','+y(0)+'L'+xs[0]+','+y(0)+'Z"/><path class="c-line" d="'+line+'"/>';
    var ex = xs[n-1], ey = y(pts[n-1].v);
    h += '<circle cx="'+ex+'" cy="'+ey+'" r="5" class="c-dot"/><text x="'+Math.min(ex, W-padR-4)+'" y="'+(ey-10)+'" class="c-label" text-anchor="end">'+signed(pts[n-1].v)+'</text>';
    h += '<line id="c-cross" x1="0" x2="0" y1="'+padT+'" y2="'+(padT+ph)+'" class="c-cross" style="display:none"/>';
  }
  pts.forEach(function(p,i){ h += '<rect class="c-hit" data-i="'+i+'" x="'+(padL+band*i)+'" y="'+padT+'" width="'+band+'" height="'+ph+'"/>'; });
  h += '</svg><div class="c-tip" id="c-tip" role="status" hidden></div>';
  box.innerHTML = h;
  var tip = document.getElementById("c-tip"), cross = document.getElementById("c-cross");
  function show(i){ var p = pts[i], cx = padL + band*i + band/2;
    tip.innerHTML = '<b>'+esc(p.sh.name||"Card show")+'</b><span>'+fmtDate(p.sh.date)+'</span><span>Profit <b class="num">'+signed(p.s.profit)+'</b></span>'+
      (chartMode==="run" ? '<span>Running total <b class="num">'+signed(p.v)+'</b></span>' : '')+
      '<span>'+(p.s.perHour!=null ? perHr(p.s.perHour) : 'No hours logged')+' · '+p.s.sold+' sold</span>';

    if(cross){ cross.setAttribute("x1",cx); cross.setAttribute("x2",cx); cross.style.display = ""; }
    box.querySelectorAll(".c-hit").forEach(function(r){ r.classList.toggle("on", +r.getAttribute("data-i")===i); }); }
  function hide(){ tip.hidden = true; if(cross) cross.style.display = "none"; box.querySelectorAll(".c-hit.on").forEach(function(r){ r.classList.remove("on"); }); }
  box.querySelectorAll(".c-hit").forEach(function(r){ var i = +r.getAttribute("data-i");
    r.addEventListener("pointerenter", function(){ show(i); }); r.addEventListener("pointerdown", function(){ show(i); }); });
  box.querySelector("svg").addEventListener("pointerleave", function(e){ if(e.pointerType==="mouse") hide(); });
}

var BK_MARK = "----- RESTORE DATA (keep this line and everything below it) -----";

  downloadsApi.save({filename:fn, data:txt}).then(function(){ markBackedUp(); state.backupPanel = {mode:"done"}; render(); })
    .catch(function(e){ var c = e && e.code; if(c==="declined"){ state.backupPanel = null; render(); return; }
      if(c==="rate_limited"){ state.backupPanel = {mode:"msg", msg:"A save window is already open. Finish that one first."}; render(); return; }

function parseBackup(text){
  var i = String(text||"").indexOf(BK_MARK), json = i>=0 ? text.slice(i+BK_MARK.length) : text;
  try{ var d = JSON.parse(json.trim()); if(d && Array.isArray(d.shows)) return d.shows.filter(function(s){ return s && typeof s==="object"; }).map(function(s){ return {id:String(s.id||uid("s")), name:String(s.name||"Card show"), date:String(s.date||""), hours:isNum(s.hours)?Number(s.hours):"", sales:Array.isArray(s.sales)?s.sales.map(function(r){ return {id:String(r.id||uid("r")), cardId:r.cardId||null, label:String(r.label||""), bought:isNum(r.bought)?Number(r.bought):"", sold:isNum(r.sold)?Number(r.sold):""}; }):[]}; }); }catch(e){}
  return null;
}
function restoreFrom(text){

  if(LOG.shows.length){ state.backupPanel = {mode:"confirm", shows:shows}; render(); return; }
  LOG.shows = shows; markBackedUp(); state.backupPanel = {mode:"msg", msg:"Restored "+shows.length+" card show"+(shows.length===1?"":"s")+"."}; render();

  h += '<section class="block"><h3>Cards ('+sh.sales.length+')</h3>';
  if(!sh.sales.length) h += '<div class="empty">No cards yet. Add the cards you bought or sold at this show below.</div>';
  else if(phone){
    h += '<div class="plist pitems">'+sh.sales.map(function(r,i){ var p = isNum(r.sold) ? Number(r.sold)-(Number(r.bought)||0) : null;
      return '<div class="prow2"><div class="top2"><b>'+esc(saleName(r))+'</b><button class="xbtn" data-sx="'+i+'" aria-label="Remove '+esc(saleName(r))+'">×</button></div>'+
        '<div class="pfields"><label>Bought for<input class="sb" data-i="'+i+'" type="number" step="0.01" min="0" inputmode="decimal" value="'+esc(isNum(r.bought)?r.bought:"")+'"></label><label>Sold for<input class="ss" data-i="'+i+'" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Not sold yet" value="'+esc(isNum(r.sold)?r.sold:"")+'"></label></div>'+
        '<div class="meta">'+(p==null?'Not sold yet':'Profit <b class="num '+(p>=0?'pos-t':'neg-t')+'">'+signed(p)+'</b>')+'</div></div>'; }).join("")+'</div>';
  } else {
    h += '<div class="tbl-wrap"><table class="pitems"><tr><th>Card</th><th class="r">Bought for</th><th class="r">Sold for</th><th class="r">Profit</th><th></th></tr>'+
      sh.sales.map(function(r,i){ var p = isNum(r.sold) ? Number(r.sold)-(Number(r.bought)||0) : null; var c = r.cardId ? cardById(r.cardId) : null;
        return '<tr><td><span class="ccell">'+(c&&c.image?'<span class="pmini"><img src="'+c.image+'" alt=""></span>':'')+'<b>'+esc(saleName(r))+'</b></span></td>'+
          '<td class="r"><input class="sb paid" data-i="'+i+'" type="number" step="0.01" min="0" inputmode="decimal" value="'+esc(isNum(r.bought)?r.bought:"")+'" aria-label="Bought for"></td>'+
          '<td class="r"><input class="ss paid" data-i="'+i+'" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Not sold" value="'+esc(isNum(r.sold)?r.sold:"")+'" aria-label="Sold for"></td>'+
          '<td class="r num '+(p==null?'':(p>=0?'pos-t':'neg-t'))+'">'+(p==null?'<span class="sub">not sold</span>':signed(p))+'</td><td><button class="xbtn" data-sx="'+i+'" aria-label="Remove '+esc(saleName(r))+'">×</button></td></tr>'; }).join("")+'</table></div>';
  }
  h += '<p class="note">Leave “Sold for” blank until it sells. Unsold cards don’t count toward profit yet.</p></section>';
  h += '<div class="padd"><label class="search"><span class="sub">Add a card</span><input id="sadd-q" type="search" placeholder="Search your site, or type any card name" autocomplete="off"></label><div class="padd-res" id="sadd-res"></div></div>';
  if(pairs.length) h += '<div class="padd pair-import"><span class="sub">Or add a whole pairing:</span><select id="spair" aria-label="Pairing to add">'+pairs.map(function(p){ return '<option value="'+esc(p.id)+'">'+esc(p.name)+' ('+p.items.length+')</option>'; }).join("")+'</select><button class="btn" id="spair-go">Add pairing</button></div>';
  root.innerHTML = h; bindHeader();
  function redraw(){ saveLog(); var y = window.scrollY; render(); window.scrollTo(0,y); }
  document.getElementById("sback").addEventListener("click", function(){ goLog(null); });
  var nm = document.getElementById("sname"); nm.addEventListener("change", function(){ sh.name = nm.value.trim() || "Card show"; saveLog(); });
  var dt = document.getElementById("sdate"); dt.addEventListener("change", function(){ sh.date = dt.value; saveLog(); });
  var hr = document.getElementById("shours"); hr.addEventListener("change", function(){ var v = parseFloat(hr.value); sh.hours = isNaN(v)||v<0 ? "" : v; redraw(); });
  var d1 = document.getElementById("sdel"); if(d1) d1.addEventListener("click", function(){ state.logConfirm = "del"; render(); });
  var d2 = document.getElementById("sdel-no"); if(d2) d2.addEventListener("click", function(){ state.logConfirm = null; render(); });
  var d3 = document.getElementById("sdel-yes"); if(d3) d3.addEventListener("click", function(){ LOG.shows = LOG.shows.filter(function(x){ return x!==sh; }); saveLog(); goLog(null); });
  root.querySelectorAll("input.sb, input.ss").forEach(function(inp){ inp.addEventListener("change", function(){ var r = sh.sales[+inp.getAttribute("data-i")], v = parseFloat(inp.value), val = isNaN(v)||v<0 ? "" : v;
    if(inp.classList.contains("sb")) r.bought = val; else r.sold = val; redraw(); }); });
  root.querySelectorAll("[data-sx]").forEach(function(b){ b.addEventListener("click", function(){ sh.sales.splice(+b.getAttribute("data-sx"),1); redraw(); }); });
  var q = document.getElementById("sadd-q"), res = document.getElementById("sadd-res");
  function addRow(row){ sh.sales.push(row); saveLog(); render(); var n = document.getElementById("sadd-q"); if(n) n.focus(); }
  q.addEventListener("input", function(){
    var raw = q.value.trim(), s2 = raw.toLowerCase(); if(!s2){ res.innerHTML = ""; return; }
    var hits = cards.filter(function(c){ return (title(c)+" "+c.set+" "+c.number).toLowerCase().indexOf(s2)>=0; }).slice(0,6);
    res.innerHTML = hits.map(function(c){ return '<button data-sadd="'+esc(c.id)+'"><span><b>'+esc(title(c))+'</b> <span class="sub">'+esc(c.set)+' · #'+esc(c.number)+'</span></span><span class="sub">+ Add</span></button>'; }).join("")+
      '<button data-snew="1"><span>Add “<b>'+esc(raw)+'</b>” (not on the site)</span><span class="sub">+ Add</span></button>';
    res.querySelectorAll("[data-sadd]").forEach(function(b){ b.addEventListener("click", function(){ addRow({id:uid("r"), cardId:b.getAttribute("data-sadd"), label:"", bought:"", sold:""}); }); });
    res.querySelector("[data-snew]").addEventListener("click", function(){ addRow({id:uid("r"), cardId:null, label:raw.slice(0,80), bought:"", sold:""}); });
  });
  var pg = document.getElementById("spair-go"); if(pg) pg.addEventListener("click", function(){ var p = pairById(document.getElementById("spair").value); if(!p) return; addPairingToShow(p, sh); render(); });
}
/* A pairing sold to a vendor: each card's cost is what you paid (or market), its sale is the vendor payout. */
function addPairingToShow(p, sh){
  p.items.forEach(function(it){ var r = itemCalc(it); if(r.missing) return;
    sh.sales.push({id:uid("r"), cardId:it.cardId, label:"", bought:Math.round(r.cost*100)/100, sold:r.noPrice ? "" : Math.round(r.payout*100)/100}); });
  saveLog();
}

/* ---------- routing ---------- */
function go(id){ state.view = id ? "detail" : "list"; state.id = id; state.selecting = false; selected = []; try{ history.replaceState(null,"", id ? "#"+id : location.pathname); }catch(e){} window.scrollTo(0,0); render(); }
function render(){
  if(state.view==="detail") renderDetail();
  else if(state.view==="pairings") renderPairings();
  else if(state.view==="pairing") renderPairing();
  else if(state.view==="log") renderLog();
  else if(state.view==="show") renderShow();
  else renderList();
  mountBar();
}

(function init(){
  var start = null;
  try{ start = sessionStorage.getItem("flipdesk.open"); sessionStorage.removeItem("flipdesk.open"); }catch(e){}
  var hash = (location.hash||"").slice(1);
  var id = start || hash;
  initPairs();
  if(id==="pairings"){ state.view="pairings"; }
  else if(id==="log"){ state.view="log"; }
  else if(id && id.indexOf("show:")===0){ state.view="show"; state.showId=id.slice(5); }
  else if(id && id.indexOf("pairing:")===0){ state.view="pairing"; state.pid=id.slice(8); }
  else if(id && cards.some(function(c){return c.id===id;})){ state.view="detail"; state.id=id; }
  measureStorage();
  applyView();
  render();
  if(VIEW!=="phone" && VIEW!=="desktop") showChooser();
  if(window.claude && typeof window.claude.use==="function"){
    window.claude.use("downloads").then(function(api){ downloadsApi = api || null; }).catch(function(){});
    window.claude.use("artifact").then(function(api){ artifactApi = api; apiChecked = true; if(!state.editing) render(); }).catch(function(){ apiChecked = true; if(!state.editing) render(); });
  } else { apiChecked = true; }
})();
})();
</script>
<script>
/* ---------- Loader / saver for the per-era files ----------
   eras/eras.json            list of eras (+ set-name patterns for guessing a new set's era)
   eras/<id>/<id>.json       {era, version, cards:[...]}  one file per era
   pairings.json             {version, pairings:[...]}
   Files are fetched with cache:"no-cache": the browser asks GitHub "changed?" and only
   re-downloads files that actually changed, which saves mobile data. */
(function(){
var LKEY="cfz.local.eras", OLD_LKEY="cfz.local";
var MAN=null, REMOTE={}, CUR={}, PENDING=[];   /* REMOTE[key]=version on GitHub; CUR[key]=JSON string of what's on screen */
function fileOf(key){ return key==="pairings" ? "pairings.json" : "eras/"+key+"/"+key+".json"; }
function nameOf(key){ return key==="pairings" ? "pairings.json" : key+".json"; }
function whereOf(key){ return key==="pairings" ? "card-flipz (main folder)" : "card-flipz → eras → "+key; }
function getJSON(url, fallback){
  return fetch(url,{cache:"no-cache"}).then(function(r){
    if(r.status===404 && fallback!==undefined) return fallback;
    if(!r.ok) throw new Error(url+" ("+r.status+")"); return r.json(); });
}
function download(name,text){ var b=new Blob([text],{type:"application/json"}); var a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},1500); }
function downloadAll(list){ list.forEach(function(it,i){ setTimeout(function(){ download(it.name, it.text); }, i*600); }); }
function readLocal(){ try{ return JSON.parse(localStorage.getItem(LKEY)||"null")||{}; }catch(e){ return {}; } }
function writeLocal(o){ localStorage.setItem(LKEY, JSON.stringify(o)); }
var rules=[];
function guessEra(set){ set=String(set||"").trim(); for(var i=0;i<rules.length;i++){ if(rules[i].res.some(function(r){return r.test(set);})) return rules[i].id; } return "other"; }
function eraOfCard(c, setEra){ if(c.era && MAN.eras.some(function(e){return e.id===c.era;})) return c.era; return setEra[c.set] || guessEra(c.set); }
function strip(c){ var o={}; for(var k in c){ if(k!=="era") o[k]=c[k]; } return o; }
/* split a full {cards, pairings} into per-file JSON strings */
function split(cards, pairings){
  var setEra={}; cards.forEach(function(c){ if(c.era && !setEra[c.set]) setEra[c.set]=c.era; });
  var out={}; MAN.eras.forEach(function(e){ out[e.id]=[]; });
  cards.forEach(function(c){ var e=eraOfCard(c,setEra); (out[e]||out.other||out[MAN.eras[MAN.eras.length-1].id]).push(strip(c)); });
  var res={}; for(var k in out) res[k]=JSON.stringify(out[k]); res.pairings=JSON.stringify(pairings||[]); return res;
}
var REMOTE_VERSION="";
window.claude={use:function(name){
  if(name==="downloads") return Promise.resolve({save:function(o){ var b=new Blob([o.data],{type:"text/plain"}); var a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=o.filename; document.body.appendChild(a); a.click(); setTimeout(function(){a.remove();},1500); return Promise.resolve(); }});
  if(name==="artifact") return Promise.resolve({publish:function(doc){
    var m=/id="app-data">([\s\S]*?)<\/scr/.exec(doc); if(!m) return Promise.reject({code:"bad_doc"});
    var d=JSON.parse(m[1]), parts=split(d.cards||[], d.pairings), stamp=String(Math.floor(Date.now()/1000));
    var local=readLocal(), files=[];
    Object.keys(parts).forEach(function(key){
      if(parts[key]===CUR[key]) return;
      var obj = key==="pairings" ? {version:stamp, pairings:JSON.parse(parts[key])} : {era:key, version:stamp, cards:JSON.parse(parts[key])};
      local[key]={base:REMOTE[key]||"", data:obj};
      files.push({key:key, name:nameOf(key), text:JSON.stringify(obj)});
    });
    if(!files.length){ setTimeout(function(){ location.reload(); }, 300); return Promise.resolve(); }
    try{ writeLocal(local); }catch(e){ return Promise.reject({code:"too_large"}); }
    downloadAll(files);
    setTimeout(function(){ location.reload(); }, 900+files.length*600);
    return Promise.resolve();
  }});
  return Promise.resolve(null);
}};
document.addEventListener("error",function(e){ var t=e.target; if(t&&t.tagName==="IMG"&&t.closest(".art")){ t.closest(".art").innerHTML='<span class="sub">No image</span>'; } },true);
function notice(dropped){
  var n=document.createElement("div"); n.className="localnote";
  var h='';
  if(PENDING.length){
    h+='You have card edits saved only on this device. To share them, upload '+(PENDING.length>1?'these files':'this file')+' (they downloaded when you saved; tap <b>Download again</b> below if you don’t have them). In GitHub open each folder below, then <b>Add file → Upload files</b>:<ul style="margin:6px 0 6px 18px;padding:0">'+
      PENDING.map(function(k){ return '<li><b>'+nameOf(k)+'</b> → '+whereOf(k)+'</li>'; }).join("")+'</ul>'+
      '<button type="button" data-redl>Download '+(PENDING.length>1?'them':'it')+' again</button> <button type="button" data-discard>Discard my local edits</button>';
  }
  if(dropped.length) h+=(h?'<br>':'')+'Heads up: GitHub got a newer copy of '+dropped.map(nameOf).join(", ")+' (e.g. the Friday price refresh), so the unsaved edits you had on this device for '+(dropped.length>1?'those files':'that file')+' were dropped. Re-enter them if they weren’t uploaded.';
  if(!h) return;
  n.innerHTML=h;
  var rd=n.querySelector("[data-redl]"); if(rd) rd.onclick=function(){ var l=readLocal(); downloadAll(PENDING.filter(function(k){return l[k];}).map(function(k){ return {name:nameOf(k), text:JSON.stringify(l[k].data)}; })); };
  var ds=n.querySelector("[data-discard]"); if(ds) ds.onclick=function(){ if(confirm("Discard the edits saved on this device and go back to the shared list?")){ try{localStorage.removeItem(LKEY);}catch(e){} location.reload(); } };
  document.body.insertBefore(n,document.body.firstChild);
}
getJSON("eras/eras.json").then(function(man){
  MAN=man; rules=man.eras.map(function(e){ return {id:e.id, res:(e.match||[]).map(function(p){ return new RegExp(p,"i"); })}; });
  return Promise.all(man.eras.map(function(e){ return getJSON(fileOf(e.id), {era:e.id, version:"", cards:[]}); }).concat([getJSON("pairings.json", {version:"", pairings:[]})]));
}).then(function(files){
  var data={}, local=readLocal(), dropped=[], changedLocal=false;
  MAN.eras.forEach(function(e,i){ data[e.id]=files[i]; });
  data.pairings=files[files.length-1];
  Object.keys(data).forEach(function(k){ REMOTE[k]=String(data[k].version||""); });
  /* One-time: edits saved on this device under the old single cards.json */
  var old=null; try{ old=JSON.parse(localStorage.getItem(OLD_LKEY)||"null"); }catch(e){}
  if(old){
    if(old.base===MAN.legacyVersion && old.data){
      var remoteParts={}; Object.keys(data).forEach(function(k){ remoteParts[k]=JSON.stringify(k==="pairings"?data[k].pairings:data[k].cards); });
      var p=split(old.data.cards||[], old.data.pairings), stamp=String(Math.floor(Date.now()/1000));
      Object.keys(p).forEach(function(k){ if(p[k]!==remoteParts[k] && !local[k]){ local[k]={base:REMOTE[k], data:k==="pairings"?{version:stamp,pairings:JSON.parse(p[k])}:{era:k,version:stamp,cards:JSON.parse(p[k])}}; changedLocal=true; } });
    }
    try{ localStorage.removeItem(OLD_LKEY); }catch(e){}
  }
  Object.keys(local).forEach(function(k){
    var l=local[k];
    if(data[k] && l && l.base===REMOTE[k] && l.data){ data[k]=l.data; PENDING.push(k); }
    else { if(l && l.data && String(l.data.version)!==REMOTE[k]) dropped.push(k); delete local[k]; changedLocal=true; }
  });
  if(changedLocal){ try{ if(Object.keys(local).length) writeLocal(local); else localStorage.removeItem(LKEY); }catch(e){} }
  var cards=[];
  MAN.eras.forEach(function(e){ (data[e.id].cards||[]).forEach(function(c){ c.era=e.id; cards.push(c); }); });
  var parts=split(cards, data.pairings.pairings); for(var k in parts) CUR[k]=parts[k];
  var eras=MAN.eras.map(function(e){ return {id:e.id, name:e.name, years:e.years, match:e.match||[]}; });
  document.getElementById("app-data").textContent=JSON.stringify({cards:cards, pairings:data.pairings.pairings||[], eras:eras});
  notice(dropped);
  var s=document.createElement("script"); s.textContent=document.getElementById("app-js").textContent; document.body.appendChild(s);
}).catch(function(err){ document.getElementById("root").innerHTML='<p style="padding:40px;text-align:center">Couldn\'t load the card list. Make sure the <b>eras</b> folder (with eras.json and one folder per era) is uploaded next to index.html. ('+err.message+')</p>'; });
})();
</script>
