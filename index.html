<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chaundoo Card Flipz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>:root{box-sizing:border-box}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="app-style">
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#eef1f7; --ink:#141b2d; --muted:#5d6782; --line:#dde2ec;
  --navy:#1b2540; --navy-ink:#ffffff; --gold:#e3a800; --gold-soft:#fff5d4; --gold-ink:#7a5a00;
  --pos:#16803c; --pos-soft:#e5f4ea; --neg:#b42323; --neg-soft:#fbe9e9; --est:#eceff5;
  --shadow:0 8px 24px rgba(20,27,45,.12);
  --pop10:#d99c00; --pop9:#3b6fd8; --poprest:#d5dbe6;
  --gain:#2a78d6; --loss:#e34948;
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1322; --surface:#161d30; --surface-2:#1d2640; --ink:#e8ecf6; --muted:#9aa4c0; --line:#2a3452;
    --navy:#243056; --navy-ink:#ffffff; --gold:#f0bd2a; --gold-soft:#3a3014; --gold-ink:#f6d677;
    --pos:#4fcf7d; --pos-soft:#15301f; --neg:#ff7a7a; --neg-soft:#3a1a1d; --est:#262f49;
    --shadow:0 8px 24px rgba(0,0,0,.4);
    --pop10:#b8870c; --pop9:#5b8cf0; --poprest:#2f3a5a;
    --gain:#3987e5; --loss:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1322; --surface:#161d30; --surface-2:#1d2640; --ink:#e8ecf6; --muted:#9aa4c0; --line:#2a3452;
  --navy:#243056; --navy-ink:#ffffff; --gold:#f0bd2a; --gold-soft:#3a3014; --gold-ink:#f6d677;
  --pos:#4fcf7d; --pos-soft:#15301f; --neg:#ff7a7a; --neg-soft:#3a1a1d; --est:#262f49;
  --shadow:0 8px 24px rgba(0,0,0,.4);
  --pop10:#b8870c; --pop9:#5b8cf0; --poprest:#2f3a5a;
    --gain:#3987e5; --loss:#e66767;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
#root{max-width:1180px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 0 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,var(--gold) 0 46%,var(--ink) 46% 54%,var(--surface) 54%);border:3px solid var(--ink);position:relative;flex:none}
.mark:after{content:"";position:absolute;inset:50% auto auto 50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.brand h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.settings{display:flex;flex-wrap:wrap;gap:8px}
.set-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;color:var(--muted)}
.set-chip input{width:62px;border:none;background:var(--surface-2);border-radius:5px;padding:3px 5px;text-align:right;color:var(--ink);font-weight:600}
.set-chip.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold-ink)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0}
.search{flex:1 1 220px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search input{border:none;background:transparent;padding:10px 4px;width:100%;outline:none}
.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--gold);color:#1b1400;border-color:transparent}
.btn.dark{background:var(--navy);color:var(--navy-ink);border-color:transparent}
.btn.danger{background:var(--neg);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.readonly-note{font-size:13px;color:var(--muted)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .art{aspect-ratio:63/88;border-radius:9px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center;max-width:100%}
.tile .art img{width:100%;height:100%;object-fit:cover;display:block}
.tile .art img:not([src]){visibility:hidden}
.more-row{display:flex;flex-direction:column;align-items:center;gap:8px;margin:22px 0 4px}
.more-row .btn{min-width:200px;padding:12px 20px}
.tile h3{font-size:17px;font-weight:700}
.sub{color:var(--muted);font-size:12.5px}
.tile .prices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv{background:var(--surface-2);border-radius:7px;padding:6px 8px}
.kv span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kv b{font-size:15px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.v-grade{background:var(--pos-soft);color:var(--pos)}
.pill.v-sel{background:var(--gold-soft);color:var(--gold-ink)}
.pill.v-no{background:var(--neg-soft);color:var(--neg)}
.pill.v-hold{background:var(--est);color:var(--muted)}
.pill.pos{background:var(--pos-soft);color:var(--pos)}
.pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.est{background:var(--est);color:var(--muted);font-weight:600}
.profit-kv b{margin-right:4px}
.profit-kv .pill{display:inline-block;text-transform:none;letter-spacing:0;font-size:11px}
.popbox{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px}
.pophead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.pophead span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.pophead small{font-size:12px;color:var(--muted)}
.popgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.popcard{border-radius:10px;background:var(--surface-2);padding:12px}
.popcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.popcard-top b{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:.02em}
.popcard-top span{font-size:12.5px;color:var(--muted)}
.pop-hero{margin:6px 0 10px;font-size:13.5px}
.pop-hero b{font-family:var(--display);font-size:26px;font-weight:800;margin-right:4px;font-variant-numeric:tabular-nums}
.popbar{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;background:var(--surface)}
.popbar i{display:block;height:100%;min-width:3px}
.popbar .s10{background:var(--pop10)} .popbar .s9{background:var(--pop9)} .popbar .srest{background:var(--poprest);flex:1 1 auto}
.poplegend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.poplegend div{font-size:11.5px;color:var(--muted);line-height:1.3}
.poplegend div b{display:block;color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.poplegend em{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0;font-style:normal}
.poplegend .k10{background:var(--pop10)} .poplegend .k9{background:var(--pop9)} .poplegend .krest{background:var(--poprest)}
.popcard.none{display:flex;flex-direction:column;justify-content:center;gap:4px;color:var(--muted);font-size:13px;background:transparent;border:1px dashed var(--line)}
.popcard.none b{color:var(--ink);font-family:var(--display);font-size:18px}
.flipline{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin-top:5px;padding:5px 7px;border-radius:6px}
.flipline .fl-route{flex:1 0 100%}
.flipline.best{background:var(--surface)}
.flipline .fl-route{font-size:11.5px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600;line-height:1.25}
.flipline .fl-route em{font-style:normal;color:var(--muted);opacity:.8}
.flipline b{font-size:15px}
.flipline .pill{font-size:10.5px;padding:2px 6px}
.gapbar{height:6px;border-radius:99px;background:var(--surface);margin-top:7px;overflow:hidden}
.gapbar i{display:block;height:100%;border-radius:99px;background:var(--pos)}
.gapkv.warn .gapbar i{background:var(--gold)} .gapkv.neg .gapbar i{background:var(--neg)}
.bekv b{font-size:17px;margin-right:4px}
.bekv .pill{display:inline-block;text-transform:none;letter-spacing:0;font-size:11px}
.bekv.none b{font-size:13px;color:var(--muted)}
.conds{display:flex;flex-wrap:wrap;gap:4px}
.conds span{background:var(--surface-2);border-radius:6px;padding:3px 6px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.conds i{font-style:normal;font-size:10px;letter-spacing:.06em;color:var(--muted);margin-right:2px}
.bestflip{border-radius:10px;padding:9px 10px;background:var(--pos-soft)}
.bestflip.warn{background:var(--gold-soft)} .bestflip.neg,.bestflip.none{background:var(--surface-2)}
.bestflip .lbl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.bf-main{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.bf-main b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.bestflip.pos .bf-main b{color:var(--pos)} .bestflip.warn .bf-main b{color:var(--gold-ink)} .bestflip.neg .bf-main b{color:var(--neg)}
.bestflip.none b{font-size:13px;color:var(--muted)}
.bf-route{font-size:12.5px;font-weight:600;margin-top:3px}
.bf-route em{font-style:normal;color:var(--muted);font-weight:500}
.advbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.advbtn i{width:32px;height:18px;border-radius:99px;background:var(--poprest);position:relative;flex:none;transition:background .15s}
.advbtn i:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.advbtn[aria-checked="true"]{color:var(--ink)}
.advbtn[aria-checked="true"] i{background:var(--pos)}
.advbtn[aria-checked="true"] i:after{left:16px}
tr.bestrow td{background:color-mix(in srgb,var(--pos-soft) 70%,transparent)}
.prow2.bestrow{background:color-mix(in srgb,var(--pos-soft) 60%,transparent)}
.poptile{margin-top:-4px;display:flex;align-items:center;gap:5px}
.poptile em{width:8px;height:8px;border-radius:2px;background:var(--pop10);flex:none}
.storage{margin-top:36px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px;color:var(--muted)}
.storage-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;margin-bottom:8px}
.storage-row b{color:var(--ink)}
.meter{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--pos)}
.meter.warn i{background:var(--gold)}
.meter.full i{background:var(--neg)}
.storage p{margin:8px 0 0}
.tile-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border-radius:14px;border:1px dashed var(--line)}

/* detail */
.back{margin:16px 0 8px}
.detail-head{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
.detail-head .art{border-radius:12px;overflow:hidden;box-shadow:var(--shadow);max-width:100%}
.detail-head .art img{display:block;width:100%}
.title-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.title-row h2{font-size:34px;font-weight:800;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--display);font-size:24px;font-weight:800}
.kpi small{display:block;color:var(--muted);font-size:12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.fact span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:2px}
section.block{margin-top:26px}
section.block h3{font-size:13px;font-family:var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
td.g{font-weight:700;white-space:nowrap}
th.v{background:var(--gold-soft);color:var(--gold-ink)}
td.v{background:color-mix(in srgb,var(--gold-soft) 55%,transparent)}
.pos-t{color:var(--pos);font-weight:700}.neg-t{color:var(--neg);font-weight:700}
.verdict{margin-top:14px;background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:14px 16px}
.verdict .tag{display:inline-block;background:var(--gold);color:#1b1400;font-weight:800;padding:3px 9px;border-radius:5px;margin-right:8px;font-size:13px}
.verdict p{margin:8px 0 0;opacity:.88}
.note{font-size:12.5px;color:var(--muted);margin-top:6px}
.tcglink{color:var(--pop9);font-weight:600;text-decoration:none;white-space:nowrap}
.tcglink:hover{text-decoration:underline}

/* editor */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,26,.55);display:flex;justify-content:flex-end;z-index:20}
.sheet{background:var(--bg);width:min(720px,100%);height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 90px)}
.sheet h2{font-size:24px;font-weight:800;margin-bottom:4px}
fieldset{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;margin:14px 0 0}
legend{font-weight:700;font-size:13px;padding:0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px;color:var(--ink);font-weight:400;font-size:14px}
label.f textarea{min-height:64px;resize:vertical}
.prow{display:grid;grid-template-columns:110px 100px 1fr 120px 56px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow.g{grid-template-columns:110px 100px 1fr 56px}
.prow b{font-size:13px}
.prow input{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 8px;width:100%;min-width:0}
.prow .chk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.phead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.drop{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.drop .preview{width:110px;aspect-ratio:63/88;border-radius:8px;border:2px dashed var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center;padding:4px;flex:none}
.drop .preview img{width:100%;height:100%;object-fit:cover}
.sheet-actions{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);padding:14px 0;margin-top:16px;border-top:1px solid var(--line)}
.msg{font-size:13px}
.msg.err{color:var(--neg)} .msg.ok{color:var(--pos)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

@media (max-width:700px){
  .detail-head{grid-template-columns:1fr}
  .detail-head .art{width:200px;margin:0 auto}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .facts{grid-template-columns:1fr}
  .title-row h2{font-size:28px}
  .prow,.prow.g{grid-template-columns:1fr 1fr}
  .prow b{grid-column:1/-1}
  .phead{display:none}
}
/* view chooser */
.chooser-bg{position:fixed;inset:0;background:rgba(10,14,26,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.chooser{background:var(--surface);border-radius:16px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow);text-align:center}
.chooser h2{font-size:22px;font-weight:800;margin-bottom:6px}
.chooser p{margin:0 0 16px;color:var(--muted);font-size:14px}
.addlink{text-align:left;max-width:460px}
.addlink label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
.addlink input,.addlink select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.addlink .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.addlink .msg{margin-top:12px;font-size:14px}
.addlink .msg.err{color:var(--neg)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;font-size:16px}
.choice.suggest{border-color:var(--gold)}
.choice small{font-weight:500;color:var(--muted);font-size:12px}
.ico-desk{width:52px;height:34px;border:3px solid var(--ink);border-radius:4px;position:relative;margin-bottom:6px}
.ico-desk:after{content:"";position:absolute;left:14px;right:14px;bottom:-9px;height:4px;background:var(--ink);border-radius:2px}
.ico-phone{width:24px;height:42px;border:3px solid var(--ink);border-radius:6px;position:relative}
.ico-phone:after{content:"";position:absolute;left:50%;bottom:3px;width:6px;height:3px;margin-left:-3px;background:var(--ink);border-radius:2px}
.viewbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted);font-weight:600}
.fees{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0}
.fees summary{padding:10px 12px;font-size:14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.fees summary::-webkit-details-marker{display:none}
.fees[open] summary{border-bottom:1px solid var(--line)}
.fees .settings{padding:10px 12px}
.plist{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.prow2{padding:12px 14px;border-bottom:1px solid var(--line)}
.prow2:last-child{border-bottom:none}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

function calc(c, key, kind){
  var g = c.graded && c.graded[key]; var sale = g && Number(g.price);
  if(!(sale>0)) return null;
  var buy = buyOf(c), fee = kind==="cgc" ? S.cgc : S.psa;
  var cost = buy + fee, sellFee = Math.round(sale*S.ebay/100);
  var ebayNet = sale - sellFee - cost, vendorBuy = sale*S.vendor/100, vendorNet = vendorBuy - cost;
  return {sale:sale, fee:fee, cost:cost, sellFee:sellFee, ebayNet:ebayNet, ebayM:cost?ebayNet/cost*100:0, vendorBuy:vendorBuy, vendorNet:vendorNet, vendorM:cost?vendorNet/cost*100:0};

/* Storage meter: cards are saved one file per era. GitHub's web upload takes files up to 25 MB each,
   so the limit that matters is the BIGGEST era file, not the total. */
var LIMIT = 25*1000*1000, SLOW_AT = 10*1000*1000, storageInfo = null;
function measureStorage(){
  try{
    var enc = new TextEncoder(), by = {};
    ERAS.forEach(function(e){ by[e.id] = []; });
    cards.forEach(function(c){ var k = by[c.era] ? c.era : (ERAS.length ? ERAS[ERAS.length-1].id : "other"); (by[k] = by[k] || []).push(c); });
    var sizes = Object.keys(by).map(function(k){ return {id:k, n:by[k].length, bytes:enc.encode(JSON.stringify({era:k, version:"0000000000", cards:by[k]})).length}; });
    var total = sizes.reduce(function(t,x){ return t+x.bytes; }, 0);
    var big = sizes.reduce(function(m,x){ return x.bytes>m.bytes ? x : m; }, sizes[0]||{id:"", n:0, bytes:0});
    var per = cards.length ? total/cards.length : 1300;
    storageInfo = {total:total, big:big, per:per, files:sizes.filter(function(x){return x.n;}).length, room:Math.max(0, Math.floor((LIMIT-big.bytes)/per))};
  }catch(e){ storageInfo = null; }
}
function mb(n){ return (n/1000000).toFixed(n<10000000?1:0); }
function storageMeter(){
  if(!storageInfo) return "";

  var cls = frac>=0.9 ? "full" : s.big.bytes>=SLOW_AT ? "warn" : "";
  var msg = frac>=0.9 ? "The "+eraName(s.big.id)+" file is close to GitHub's 25 MB web-upload limit. Split that era into two (add a new era in eras/eras.json), or upload it with GitHub Desktop, which allows up to 100 MB."
    : s.big.bytes>=SLOW_AT ? "The "+eraName(s.big.id)+" file is over 10 MB. Saving a card in that era means uploading a big file; consider splitting the era in two."
    : "Plenty of room. Each era is its own file, and GitHub's web uploader takes up to 25 MB per file. Your phone only re-downloads an era's file when it has changed.";
  return '<div class="storage" role="status"><div class="storage-row"><span>Biggest era file ('+esc(eraName(s.big.id))+'): <b class="num">'+mb(s.big.bytes)+' of 25 MB</b> ('+pctUsed+'%)</span><span><b class="num">'+cards.length.toLocaleString()+'</b> cards in '+s.files+' era files · '+mb(s.total)+' MB total · room for about <b class="num">'+s.room.toLocaleString()+'</b> more in that era</span></div>'+
    '<div class="meter '+cls+'" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pctUsed+'" aria-label="Biggest era file vs GitHub upload limit"><i style="width:'+Math.max(1,pctUsed)+'%"></i></div><p>'+msg+'</p></div>';
}

/* Condition flip: buy a lower condition, resell one condition up (after the eBay fee). */
/* Routes: buy one condition at market, resell one step up. Exit = eBay (minus fee) or a vendor (vendor % of market). */

  exit = exit||state.exit;
  function px(k){ var x = c.raw && c.raw[k]; var v = x && Number(x.price); return v>0 ? {p:v, est:!!x.est} : null; }
  var keep = exit==="vendor" ? S.vendor/100 : 1 - S.ebay/100;
  var routes = FLIPS.map(function(f){
    var b = px(f[0]), s = px(f[1]); if(!b || !s) return null;
    var net = s.p*keep - b.p;
    return {fk:f[0], tk:f[1], from:f[2], to:f[3], buy:b.p, sell:s.p, net:net, roi:net/b.p*100, est:b.est||s.est};
  }).filter(Boolean);

function watchImages(){

  function show(img){ var c = byId[img.getAttribute("data-img")]; if(c && c.image){ img.setAttribute("data-full", c.image); img.src = thumb(c); } img.removeAttribute("data-img"); }

  }, {rootMargin:"600px 0px"});

/* Smart search: words can be in any order, a bare number matches the card number ("charizard 4" finds 004/102),
   and small typos still find the card ("charzard", "pikahcu"). Exact matches show first; close matches only
   show when nothing matches exactly. */
function sFold(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }

  var key = c.name+"|"+(c.variant||"")+"|"+c.set+"|"+c.number, hit = sCache && sCache.get(c);
  if(hit && hit.key===key) return hit;
  var words = sWords(title(c)+" "+c.set), parts = String(c.number||"").split("/");
  var ix = { key:key, words:words, flat:words.join(""), num:normNum(parts[0]), den:parts[1]?normNum(parts[1]):"", raw:sFold(c.number).replace(/[^a-z0-9]/g,"") };

function sDist(a, b, max){
  if(Math.abs(a.length-b.length)>max) return max+1;

  for(j=0;j<=b.length;j++) prev[j] = j;
  for(i=1;i<=a.length;i++){
    var cur = [i], best = i;
    for(j=1;j<=b.length;j++){
      var cost = a[i-1]===b[j-1]?0:1;
      var v = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
      if(prev2 && i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) v = Math.min(v, prev2[j-2]+1);
      cur[j] = v; if(v<best) best = v;

}
function sAllow(len){ return len<4 ? 0 : len<7 ? 1 : 2; }
function sParse(q){

    if(t.den!==undefined) return (ix.num===t.num && (!ix.den || ix.den.indexOf(t.den)===0)) ? 0 : -1;
    if(ix.num===t.num || ix.raw===t.raw) return 0;
    for(var k=0;k<ix.words.length;k++) if(ix.words[k]===t.raw) return 0;
    return -1;

  var w = t.w, i;
  for(i=0;i<ix.words.length;i++) if(ix.words[i].indexOf(w)>=0) return 0;

var lastFuzzy = false;

    if(state.sort==="updated") return String(b.updated).localeCompare(String(a.updated));

      var ba = breakEven(a), bb = breakEven(b);
      if(!ba && !bb) return title(a).localeCompare(title(b));
      if(!ba) return 1; if(!bb) return -1;
      if(ba.grade!==bb.grade) return Number(ba.grade)-Number(bb.grade);
      return bb.net-ba.net;
    }
    return title(a).localeCompare(title(b));
  });
  return list;
}

  var dup = findDuplicate(e, state.isNew ? null : e.id);

/* ---------- saving pairings + profit log to GitHub ----------

  items:(Array.isArray(p.items)?p.items:[]).map(function(it){ it = it||{}; return {cardId:String(it.cardId||""), bought:String(it.bought||"nm"), sellAs:String(it.sellAs||"nm"), paid:numOr(it.paid)}; })}; }
function normShow(s){ s = s||{}; return {id:String(s.id||uid("s")), name:String(s.name||"Card show").slice(0,60), date:String(s.date||"").slice(0,10), hours:numOr(s.hours), notes:String(s.notes||"").slice(0,NOTES_MAX),

/* Each changed card show is locked (encrypted) on this phone before it goes to GitHub, so the public repo

var ENC = {};
function b64e(u){ var t = ""; for(var i=0;i<u.length;i++) t += String.fromCharCode(u[i]); return btoa(t); }

  return out; }

  return {c:c, mv:mv, mkt:mkt, cost:cost, payout:payout, profit:payout-cost, ebayProfit:mv*(1-S.ebay/100)-cost, noPrice:!(mv>0) || !(cost>0 || hasPaid)};

function loadLog(){
  var shows = applyDraft(REMOTE_SHOWS, SYNC.shows), last = load("flipdesk.lastBackup", "");
  /* One-time move: a log that was kept only on this device joins the shared log (as unsaved changes) */
  var old = load("flipdesk.profitlog", null);
  if(old && Array.isArray(old.shows)){
    var have = {}; shows.forEach(function(s){ have[s.id] = 1; });
    old.shows.forEach(function(s){ s = normShow(s); if(!have[s.id]) shows.push(s); });
    if(old.lastBackup && !last){ last = old.lastBackup; save("flipdesk.lastBackup", last); }
    save("flipdesk.profitlog.old", old);
    try{ localStorage.removeItem("flipdesk.profitlog"); }catch(e){}
  }
  return {shows:shows, lastBackup:last};
}
function saveLog(){ syncSave(); mountBar(); }
function todayStr(){ var d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function uid(p){ return p+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function showById(id){ for(var i=0;i<LOG.shows.length;i++) if(LOG.shows[i].id===id) return LOG.shows[i]; return null; }
function isNum(v){ return v!=="" && v!=null && !isNaN(Number(v)); }
function saleName(r){ var c = r.cardId ? cardById(r.cardId) : null; return c ? title(c) : (r.label || "Card"); }
function showStats(sh){
  var t = {spent:0, got:0, profit:0, sold:0, unsold:0, unsoldCost:0, hours:Number(sh.hours)||0};
  sh.sales.forEach(function(r){ var b = Number(r.bought)||0; t.spent += b;
    if(isNum(r.sold)){ t.sold++; t.got += Number(r.sold); t.profit += Number(r.sold) - b; } else { t.unsold++; t.unsoldCost += b; } });
  t.perHour = t.hours > 0 ? t.profit/t.hours : null; return t;
}
function logStats(){
  var t = {profit:0, hours:0, hProfit:0, shows:LOG.shows.length, sold:0};
  LOG.shows.forEach(function(sh){ var s = showStats(sh); t.profit += s.profit; t.sold += s.sold; if(s.hours > 0){ t.hours += s.hours; t.hProfit += s.profit; } });
  t.perHour = t.hours > 0 ? t.hProfit/t.hours : null; t.avg = t.shows ? t.profit/t.shows : null; return t;
}
function sortedShows(asc){ return LOG.shows.slice().sort(function(a,b){ var c = String(a.date).localeCompare(String(b.date)); return asc ? c : -c; }); }
function perHr(n){ return n==null ? "—" : (n<0?"−":"")+"$"+Math.abs(n).toFixed(Math.abs(n)<100?2:0).replace(/\.00$/,"")+"/hr"; }
function backupDue(){
  return false; /* the log lives on GitHub now; backups are optional (Save backup at the bottom) */
  if(!LOG.shows.length) return false;
  try{ if(sessionStorage.getItem("flipdesk.backupSnooze")===todayStr()) return false; }catch(e){}
  var last = LOG.lastBackup; if(!last) return true;
  var days = (new Date(todayStr()) - new Date(last))/864e5;
  return days >= 7 || (new Date().getDay()===5 && last !== todayStr());
}
function goLog(showId){ state.view = showId ? "show" : "log"; state.showId = showId||null; state.selecting = false; selected = []; state.logConfirm = null; state.backupPanel = null;
  try{ history.replaceState(null,"","#"+(showId?"show:"+showId:"log")); }catch(e){} window.scrollTo(0,0); render(); }
function newShow(name){
  var sh = {id:uid("s"), name:name||"Card show", date:todayStr(), hours:"", sales:[]};
  LOG.shows.push(sh); saveLog(); return sh;
}

/* --- chart: one series (profit per show, or running total); gains blue above zero, losses red below --- */
function niceTicks(lo, hi){
  if(lo===hi){ hi = lo + 10; }
  var span = hi - lo, step = Math.pow(10, Math.floor(Math.log10(span/4))), err = span/4/step;
  step *= err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1;
  var a = Math.floor(lo/step)*step, b = Math.ceil(hi/step)*step, out = [];
  for(var v=a; v<=b+step/2; v+=step) out.push(Math.round(v*100)/100);
  return out;
}
function tickLabel(v){ var a = Math.abs(v); return (v<0?"−":"")+"$"+(a>=1000 ? (a/1000).toFixed(a%1000?1:0)+"k" : a); }
function drawChart(){
  var box = document.getElementById("pchart"); if(!box) return;
  var shows = sortedShows(true); if(!shows.length) return;
  var W = Math.max(280, box.clientWidth), H = 230, padL = 48, padR = 14, padT = 16, padB = 30, pw = W-padL-padR, ph = H-padT-padB;
  var run = 0, pts = shows.map(function(sh){ var s = showStats(sh); run += s.profit; return {sh:sh, s:s, v:chartMode==="run" ? run : s.profit}; });
  var lo = Math.min(0, Math.min.apply(null, pts.map(function(p){ return p.v; }))), hi = Math.max(0, Math.max.apply(null, pts.map(function(p){ return p.v; })));
  var ticks = niceTicks(lo, hi); lo = ticks[0]; hi = ticks[ticks.length-1];
  function y(v){ return padT + (hi - v)/(hi - lo)*ph; }
  var n = pts.length, band = pw/n, h = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(chartMode==="run"?"Running total of profit":"Profit for each card show")+'">';
  ticks.forEach(function(t){ var yy = Math.round(y(t))+0.5; h += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+yy+'" y2="'+yy+'" class="'+(t===0?'c-zero':'c-grid')+'"/><text x="'+(padL-8)+'" y="'+(yy+4)+'" class="c-tick" text-anchor="end">'+tickLabel(t)+'</text>'; });
  var every = Math.max(1, Math.ceil(n/7));
  pts.forEach(function(p,i){ var cx = padL + band*i + band/2;
    if(i % every === 0 || i === n-1){ var m = /^\d{4}-(\d{2})-(\d{2})$/.exec(p.sh.date||""); h += '<text x="'+cx+'" y="'+(H-10)+'" class="c-tick" text-anchor="middle">'+(m ? (+m[1])+"/"+(+m[2]) : "")+'</text>'; } });
  if(chartMode==="show"){
    var bw = Math.min(24, band*0.6), r = Math.min(4, bw/2), y0 = y(0);
    pts.forEach(function(p,i){ var x = padL + band*i + (band-bw)/2, yv = y(p.v), up = p.v >= 0, hgt = Math.abs(y0 - yv);
      if(hgt < 1) h += '<rect x="'+x+'" y="'+(y0-1)+'" width="'+bw+'" height="2" class="c-flat"/>';
      else { var rr = Math.min(r, hgt);
        h += up ? '<path class="c-gain" d="M'+x+','+y0+'V'+(yv+rr)+'Q'+x+','+yv+' '+(x+rr)+','+yv+'H'+(x+bw-rr)+'Q'+(x+bw)+','+yv+' '+(x+bw)+','+(yv+rr)+'V'+y0+'Z"/>'
                : '<path class="c-loss" d="M'+x+','+y0+'V'+(yv-rr)+'Q'+x+','+yv+' '+(x+rr)+','+yv+'H'+(x+bw-rr)+'Q'+(x+bw)+','+yv+' '+(x+bw)+','+(yv-rr)+'V'+y0+'Z"/>'; }
    });
    var last = pts[n-1], lx = padL + band*(n-1) + band/2, ly = y(last.v);
    h += '<text x="'+lx+'" y="'+(last.v>=0 ? ly-7 : ly+15)+'" class="c-label" text-anchor="middle">'+signed(last.v)+'</text>';
  } else {
    var xs = pts.map(function(p,i){ return padL + band*i + band/2; });
    var line = pts.map(function(p,i){ return (i?'L':'M')+xs[i]+','+y(p.v); }).join('');
    h += '<path class="c-area" d="'+line+'L'+xs[n-1]+','+y(0)+'L'+xs[0]+','+y(0)+'Z"/><path class="c-line" d="'+line+'"/>';
    var ex = xs[n-1], ey = y(pts[n-1].v);
    h += '<circle cx="'+ex+'" cy="'+ey+'" r="5" class="c-dot"/><text x="'+Math.min(ex, W-padR-4)+'" y="'+(ey-10)+'" class="c-label" text-anchor="end">'+signed(pts[n-1].v)+'</text>';
    h += '<line id="c-cross" x1="0" x2="0" y1="'+padT+'" y2="'+(padT+ph)+'" class="c-cross" style="display:none"/>';
  }
  pts.forEach(function(p,i){ h += '<rect class="c-hit" data-i="'+i+'" x="'+(padL+band*i)+'" y="'+padT+'" width="'+band+'" height="'+ph+'"/>'; });
  h += '</svg><div class="c-tip" id="c-tip" role="status" hidden></div>';
  box.innerHTML = h;
  var tip = document.getElementById("c-tip"), cross = document.getElementById("c-cross");
  function show(i){ var p = pts[i], cx = padL + band*i + band/2;
    tip.innerHTML = '<b>'+esc(p.sh.name||"Card show")+'</b><span>'+fmtDate(p.sh.date)+'</span><span>Profit <b class="num">'+signed(p.s.profit)+'</b></span>'+
      (chartMode==="run" ? '<span>Running total <b class="num">'+signed(p.v)+'</b></span>' : '')+
      '<span>'+(p.s.perHour!=null ? perHr(p.s.perHour) : 'No hours logged')+' · '+p.s.sold+' sold</span>';
    tip.hidden = false; var tw = tip.offsetWidth; tip.style.left = Math.max(4, Math.min(W - tw - 4, cx - tw/2))+"px"; tip.style.top = "4px";
    if(cross){ cross.setAttribute("x1",cx); cross.setAttribute("x2",cx); cross.style.display = ""; }
    box.querySelectorAll(".c-hit").forEach(function(r){ r.classList.toggle("on", +r.getAttribute("data-i")===i); }); }
  function hide(){ tip.hidden = true; if(cross) cross.style.display = "none"; box.querySelectorAll(".c-hit.on").forEach(function(r){ r.classList.remove("on"); }); }
  box.querySelectorAll(".c-hit").forEach(function(r){ var i = +r.getAttribute("data-i");
    r.addEventListener("pointerenter", function(){ show(i); }); r.addEventListener("pointerdown", function(){ show(i); }); });
  box.querySelector("svg").addEventListener("pointerleave", function(e){ if(e.pointerType==="mouse") hide(); });
}
window.addEventListener("resize", function(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(function(){ if(state.view==="log") drawChart(); }, 150); });

/* --- backup / restore (plain text file the owner can read, with restore data at the bottom) --- */
var BK_MARK = "----- RESTORE DATA (keep this line and everything below it) -----";
function backupText(){
  var t = logStats(), L = [];
  L.push("CHAUNDOO CARD FLIPZ — PROFIT LOG BACKUP", "Saved: "+todayStr(), "");
  L.push("Total profit: "+signed(t.profit)+"   Card shows: "+t.shows+"   Hours: "+t.hours+"   Per hour: "+perHr(t.perHour)+"   Average per show: "+(t.avg==null?"—":signed(t.avg)), "");
  sortedShows(false).forEach(function(sh){ var s = showStats(sh);
    L.push(sh.date+" · "+(sh.name||"Card show")+" · "+(s.hours||"?")+" h · profit "+signed(s.profit)+(s.perHour!=null?" · "+perHr(s.perHour):""));
    if(sh.notes) L.push("   Notes: "+sh.notes.replace(/\n/g,"\n   "));
    sh.sales.forEach(function(r){ L.push("   "+saleName(r)+" | bought $"+(Number(r.bought)||0)+" | "+(isNum(r.sold) ? "sold $"+Number(r.sold)+" | "+signed(Number(r.sold)-(Number(r.bought)||0)) : "not sold yet")); });
    L.push("");
  });
  L.push(BK_MARK, JSON.stringify({v:1, shows:LOG.shows}));
  return L.join("\n");
}
function markBackedUp(){ LOG.lastBackup = todayStr(); save("flipdesk.lastBackup", LOG.lastBackup); }
function saveBackup(){ state.backupPanel = {mode:"choose"}; render(); window.scrollTo(0,0); }
function downloadBackup(){
  var txt = backupText(), fn = "chaundoo-profit-log-"+todayStr()+".txt";
  if(!downloadsApi){ state.backupPanel = {mode:"copy", text:txt, forced:true}; render(); return; }
  downloadsApi.save({filename:fn, data:txt}).then(function(){ markBackedUp(); state.backupPanel = {mode:"done"}; render(); })
    .catch(function(e){ var c = e && e.code; if(c==="declined"){ state.backupPanel = null; render(); return; }
      if(c==="rate_limited"){ state.backupPanel = {mode:"msg", msg:"A save window is already open. Finish that one first."}; render(); return; }
      state.backupPanel = {mode:"copy", text:txt, forced:true}; render(); });
}
function parseBackup(text){
  var i = String(text||"").indexOf(BK_MARK), json = i>=0 ? text.slice(i+BK_MARK.length) : text;
  try{ var d = JSON.parse(json.trim()); if(d && Array.isArray(d.shows)) return d.shows.filter(function(s){ return s && typeof s==="object"; }).map(function(s){ return {id:String(s.id||uid("s")), name:String(s.name||"Card show"), date:String(s.date||""), hours:isNum(s.hours)?Number(s.hours):"", notes:String(s.notes||"").slice(0,NOTES_MAX), sales:Array.isArray(s.sales)?s.sales.map(function(r){ return {id:String(r.id||uid("r")), cardId:r.cardId||null, label:String(r.label||""), bought:isNum(r.bought)?Number(r.bought):"", sold:isNum(r.sold)?Number(r.sold):""}; }):[]}; }); }catch(e){}
  return null;
}
function restoreFrom(text){
  var shows = parseBackup(text);
  if(!shows){ state.backupPanel = {mode:"msg", msg:"That doesn’t look like a profit log backup. Use the .txt file from “Save backup”."}; render(); return; }
  if(LOG.shows.length){ state.backupPanel = {mode:"confirm", shows:shows}; render(); return; }
  LOG.shows = shows; markBackedUp(); saveLog(); state.backupPanel = {mode:"msg", msg:"Restored "+shows.length+" card show"+(shows.length===1?"":"s")+"."}; render();
}

/* --- passcode lock --- */
function unlockLog(code){
  var e = LOGLOCK.enc, te = new TextEncoder();
  return crypto.subtle.importKey("raw", te.encode(code), "PBKDF2", false, ["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(e.salt), iterations:e.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
  }).then(function(k){
    return crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(e.check.iv), additionalData:te.encode("check")}, k, b64d(e.check.ct)).then(function(){ return crypto.subtle.exportKey("raw", k); });
  }).then(function(raw){ save("cfz.logKey", {salt:e.salt, key:b64e(new Uint8Array(raw))}); });
}
function b64d(t){ var b = atob(t), u = new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; }
function lockLog(){ try{ localStorage.removeItem("cfz.logKey"); }catch(e){} remember(); location.reload(); }
function renderLogLock(){
  var h = header();
  h += '<form class="flock" id="llock" autocomplete="off"><h2>Profit Log</h2><p>Enter the 4-digit passcode to open your profit log.</p>'+
    '<input id="llock-code" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-label="Passcode" autofocus>'+
    '<button class="btn primary" type="submit">Unlock</button><div class="msg" id="llock-msg" role="status"></div></form>';
  root.innerHTML = h; bindHeader();
  var f = document.getElementById("llock"), inp = document.getElementById("llock-code"), msg = document.getElementById("llock-msg"), busy = false;
  function tryCode(){
    var v = inp.value.trim(); if(v.length < 4){ msg.textContent = "Enter all 4 digits."; return; }
    if(busy) return; busy = true; msg.textContent = "Unlocking…";
    if(!(window.crypto && crypto.subtle)){ msg.textContent = "This browser can't open the locked log."; busy = false; return; }
    unlockLog(v).then(function(){ msg.textContent = "Opening…"; remember(); location.reload(); })
      .catch(function(){ busy = false; msg.textContent = "Wrong passcode."; inp.value = ""; inp.focus(); });
  }
  f.addEventListener("submit", function(e){ e.preventDefault(); tryCode(); });
  inp.addEventListener("input", function(){ inp.value = inp.value.replace(/\D/g,"").slice(0,4); if(!busy) msg.textContent = ""; if(inp.value.length===4) tryCode(); });
}

/* --- views --- */
function renderLog(){
  var t = logStats(), h = header();
  h += '<div class="pair-intro"><div><h2>Profit Log</h2><p class="sub">Log each card show: what you paid, what you sold for, and how long you were there. Changes save on your phone right away; tap <b>Save to GitHub</b> to keep them on the site. The log is locked with your passcode: on GitHub it’s saved scrambled, so only someone with the passcode can read it.</p></div><button class="btn primary" id="newshow">+ Log a card show</button></div>';
  if(!logStorageOk) h += '<p class="notice">This browser is blocking storage for the site, so unsaved changes are lost if you close it. Tap Save to GitHub before leaving.</p>';
  if(backupDue() && !state.backupPanel) h += '<div class="notice bk-due"><span><b>'+(new Date().getDay()===5?'It’s Friday: save':'Time to save')+' a backup of your profit log.</b> If you lose your phone or clear your browser, this file brings it back.</span><span class="bk-acts"><button class="btn primary" id="bk-now">Save backup</button><button class="btn ghost" id="bk-snooze">Not now</button></span></div>';
  if(state.notice) h += '<p class="notice" role="status">'+esc(state.notice)+'</p>';

  } else {
    h += '<div class="log-hero"><span class="lbl">Total profit</span><b class="'+(t.profit>=0?'':'neg-t')+'">'+signed(t.profit)+'</b><span class="sub">from '+t.sold+' card'+(t.sold===1?'':'s')+' sold</span></div>';
    h += '<div class="log-tiles"><div><span>Money per hour</span><b>'+perHr(t.perHour)+'</b><small>'+(t.hours? t.hours+' hours logged' : 'Add hours to a show to see this')+'</small></div>'+
      '<div><span>Average per show</span><b>'+(t.avg==null?'—':signed(t.avg))+'</b><small>'+t.shows+' card show'+(t.shows===1?'':'s')+'</small></div></div>';
    h += '<section class="block"><div class="c-head"><h3>'+(chartMode==="run"?'Running total':'Profit by show')+'</h3><div class="seg" role="group" aria-label="Chart view"><button id="cm-show" aria-pressed="'+(chartMode==="show")+'">Each show</button><button id="cm-run" aria-pressed="'+(chartMode==="run")+'">Running total</button></div></div><div class="chart-box" id="pchart"></div></section>';
    h += '<section class="block"><h3>Card shows</h3><div class="plist">'+sortedShows(false).map(function(sh){ var s = showStats(sh);
      return '<button class="show-row" data-show="'+esc(sh.id)+'"><span class="show-date">'+fmtDate(sh.date)+'</span><span class="show-main"><b>'+esc(sh.name||"Card show")+'</b><span class="sub">'+(s.hours? s.hours+' h · ' : '')+s.sold+' sold'+(s.unsold? ' · '+s.unsold+' not sold yet':'')+'</span>'+(sh.notes ? '<span class="show-note">📝 '+esc(sh.notes.replace(/\s+/g," ").slice(0,90))+'</span>' : '')+'</span>'+
        '<span class="show-num"><b class="num '+(s.profit>=0?'':'neg-t')+'">'+signed(s.profit)+'</b><span class="sub">'+(s.perHour!=null?perHr(s.perHour):'')+'</span></span></button>'; }).join("")+'</div></section>';
  }
  if(LOGLOCK) h += '<div class="log-lockrow"><button class="btn ghost" id="loglock">🔒 Lock on this device</button></div>';
  h += '<div class="bk-foot"><span class="sub">Backup: '+(LOG.lastBackup ? 'last saved '+fmtDate(LOG.lastBackup) : 'never saved')+'</span><button class="btn ghost" id="bk-save">Save backup</button><button class="btn ghost" id="bk-restore">Restore</button></div>';
  root.innerHTML = h; bindHeader();
  document.getElementById("newshow").addEventListener("click", function(){ var sh = newShow(); goLog(sh.id); });

    if(pendingCount() && !confirm("You have changes not on GitHub yet. They stay on this phone and come back when you unlock. Lock now?")) return; lockLog(); });
  root.querySelectorAll("[data-show]").forEach(function(b){ b.addEventListener("click", function(){ goLog(b.getAttribute("data-show")); }); });

  if(a){ a.addEventListener("click", function(){ chartMode = "show"; render(); }); b.addEventListener("click", function(){ chartMode = "run"; render(); }); }

function backupPanelHtml(){
  var P = state.backupPanel; if(!P) return '';
  if(P.mode==="done") return '<p class="notice ok-note" role="status">Backup saved. Keep the file somewhere safe (email it to yourself or save it to cloud storage).</p>';
  if(P.mode==="msg") return '<p class="notice" role="status">'+esc(P.msg)+'</p>';
  if(P.mode==="choose") return '<div class="bk-panel"><b>How do you want to save your backup?</b><p class="sub">Both have the same log sheet, and either one can be used to restore your log later.</p>'+
    '<div class="bk-choices"><button class="bk-choice" id="bk-dl"'+(downloadsApi?'':' disabled')+'><b>Text file</b><span class="sub">'+(downloadsApi?'Saves a .txt file to your device':'Not available in this view')+'</span></button>'+
    '<button class="bk-choice" id="bk-copytxt"><b>Copy and paste</b><span class="sub">Shows the text to paste into Notes, a message or an email</span></button></div>'+
    '<div class="bk-acts"><button class="btn ghost" id="bk-close">Cancel</button></div></div>';
  if(P.mode==="copy") return '<div class="bk-panel"><b>Copy your backup</b><p class="sub">'+(P.forced?'Saving a file isn’t available here, so copy':'Copy')+' this text and paste it into Notes or an email to yourself. To restore later, paste it back in with Restore.</p><textarea id="bk-text" readonly rows="6">'+esc(P.text)+'</textarea><div class="bk-acts"><button class="btn primary" id="bk-copy">Copy text</button><button class="btn ghost" id="bk-close">Done</button></div></div>';
  if(P.mode==="restore") return '<div class="bk-panel"><b>Restore from a backup</b><p class="sub">Choose the backup .txt file, or paste the backup text below.</p><label class="btn">Choose file<input type="file" id="bk-file" accept=".txt,text/plain,.json" hidden></label><textarea id="bk-paste" rows="4" placeholder="…or paste the backup text here"></textarea><div class="bk-acts"><button class="btn primary" id="bk-paste-go">Restore pasted text</button><button class="btn ghost" id="bk-close">Cancel</button></div></div>';
  if(P.mode==="confirm") return '<div class="bk-panel"><b>Replace your current log?</b><p class="sub">This device has '+LOG.shows.length+' card show'+(LOG.shows.length===1?'':'s')+'. The backup has '+P.shows.length+'. Restoring replaces what’s here.</p><div class="bk-acts"><button class="btn danger" id="bk-replace">Replace with backup</button><button class="btn ghost" id="bk-close">Cancel</button></div></div>';
  return '';
}
function bindBackup(){
  function on(id, fn){ var el = document.getElementById(id); if(el) el.addEventListener("click", fn); }
  on("bk-now", saveBackup); on("bk-save", saveBackup); on("bk-dl", downloadBackup);
  on("bk-copytxt", function(){ state.backupPanel = {mode:"copy", text:backupText()}; render(); });
  on("bk-snooze", function(){ try{ sessionStorage.setItem("flipdesk.backupSnooze", todayStr()); }catch(e){} render(); });
  on("bk-restore", function(){ state.backupPanel = {mode:"restore"}; render(); window.scrollTo(0,0); });
  on("bk-close", function(){ state.backupPanel = null; render(); });
  on("bk-copy", function(){ var ta = document.getElementById("bk-text"), btn = document.getElementById("bk-copy");
    function done(){ markBackedUp(); btn.textContent = "Copied"; }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, function(){ ta.select(); try{ if(document.execCommand("copy")) done(); }catch(e){} });
    else { ta.select(); try{ if(document.execCommand("copy")) done(); }catch(e){} } });
  on("bk-replace", function(){ LOG.shows = state.backupPanel.shows; markBackedUp(); saveLog(); state.backupPanel = {mode:"msg", msg:"Restored "+LOG.shows.length+" card shows from the backup."}; render(); });
  on("bk-paste-go", function(){ restoreFrom(document.getElementById("bk-paste").value); });
  var f = document.getElementById("bk-file"); if(f) f.addEventListener("change", function(){ var file = f.files && f.files[0]; if(!file) return; var fr = new FileReader(); fr.onload = function(){ restoreFrom(String(fr.result)); }; fr.readAsText(file); });
}

/* A pairing sold to a vendor: each card's cost is what you paid (or market), its sale is the vendor payout. */
function addPairingToShow(p, sh){
  p.items.forEach(function(it){ var r = itemCalc(it); if(r.missing) return;
    sh.sales.push({id:uid("r"), cardId:it.cardId, label:"", bought:Math.round(r.cost*100)/100, sold:r.noPrice ? "" : Math.round(r.payout*100)/100}); });
  saveLog();
}

/* ---------- add a card from a TCGplayer link ----------
   The page never contacts TCGplayer or the price API (that would expose the API key).
   It opens a ready-made GitHub issue; the "Add card from TCGplayer link" GitHub job looks the card up
   on TCG Price Lookup, checks for duplicates, adds it to the right era file and replies on the issue. */
var ADD_REPO = "Chaundoo/card-flipz";
var PRINTINGS = ["Auto (from the link)","Holofoil","Reverse Holofoil","Normal","1st Edition Holofoil","1st Edition","Unlimited Holofoil","Unlimited"];
function parseTcgLink(u){
  var m = String(u||"").trim().match(/tcgplayer\.com\/product\/(\d+)(?:\/([^?#\s]*))?(?:\?([^#\s]*))?/i);
  if(!m) return null;
  var pr = ""; (m[3]||"").split("&").forEach(function(kv){ var a = kv.split("="); if(a[0].toLowerCase()==="printing") pr = decodeURIComponent((a[1]||"").replace(/\+/g," ")); });
  return {id:m[1], slug:m[2]||"", printing:pr};
}
function printingOf(c){
  if(c.tcgVariant) return c.tcgVariant.toLowerCase();
  var l = (c.variant||"").toLowerCase(), holo = l.indexOf("holo")>=0 && l.indexOf("non-holo")<0;
  if(l.indexOf("reverse")>=0) return "reverse holofoil";
  if(l.indexOf("1st edition")>=0) return holo ? "1st edition holofoil" : "1st edition";
  if(l.indexOf("unlimited")>=0) return holo ? "unlimited holofoil" : "unlimited";
  if(l.indexOf("non-holo")>=0 || l.indexOf("normal")>=0) return "normal";
  return "holofoil";
}
function showAddLink(){
  if(document.getElementById("addlink-bg")) return;
  var d = document.createElement("div"); d.className="chooser-bg"; d.id="addlink-bg";
  d.innerHTML = '<div class="chooser addlink" role="dialog" aria-modal="true" aria-labelledby="al-t"><h2 id="al-t">Add a card from TCGplayer</h2>'+
    '<p>Paste the card\'s TCGplayer link. GitHub opens with it filled in: press <b>Create</b> and the card shows up here in about 2 minutes with its condition prices.</p>'+
    '<label for="al-url">TCGplayer link</label><input id="al-url" type="url" inputmode="url" placeholder="https://www.tcgplayer.com/product/85682/...">'+
    '<label for="al-pr">Printing</label><select id="al-pr">'+PRINTINGS.map(function(p,i){ return '<option value="'+(i?esc(p):"")+'">'+esc(p)+'</option>'; }).join("")+'</select>'+
    '<div class="msg" id="al-msg" role="status"></div>'+
    '<div class="row"><button class="btn" id="al-cancel">Cancel</button><button class="btn primary" id="al-go">Add card</button></div></div>';
  document.body.appendChild(d);
  var url = document.getElementById("al-url"), pr = document.getElementById("al-pr"), msg = document.getElementById("al-msg");
  function close(){ d.remove(); }
  function say(t, err){ msg.className = "msg"+(err?" err":""); msg.innerHTML = t; }
  document.getElementById("al-cancel").addEventListener("click", close);
  d.addEventListener("click", function(e){ if(e.target===d) close(); });
  document.getElementById("al-go").addEventListener("click", function(){
    var L = parseTcgLink(url.value);
    if(!L){ say("That doesn't look like a TCGplayer card link. It should contain tcgplayer.com/product/ and a number.", true); return; }
    var want = (pr.value || L.printing || "").toLowerCase();
    var same = cards.filter(function(c){ return String(c.tcgId||"")===L.id; });
    var dup = same.filter(function(c){ return !want || printingOf(c)===want; })[0];
    if(dup){ say('Already on the site: <a href="#'+esc(dup.id)+'" id="al-open">'+esc(dup.name)+' ('+esc(dup.variant||"")+')</a>. Pick a different printing if you meant another version.', true);
      document.getElementById("al-open").addEventListener("click", function(e){ e.preventDefault(); close(); go(dup.id); }); return; }
    var body = "TCGplayer link: "+url.value.trim()+"\nPrinting: "+(pr.value || L.printing || "auto")+"\n\nPress Create. The bot adds the card and replies here (about 2 minutes).";
    var gh = "https://github.com/"+ADD_REPO+"/issues/new?title="+encodeURIComponent("Add card: "+L.id)+"&body="+encodeURIComponent(body);
    window.open(gh, "_blank", "noopener");
    say("GitHub opened in a new tab. Press <b>Create</b> there, then refresh this page in about 2 minutes. If the card can't be added, the bot explains why on that GitHub page.");
  });
  url.focus();
}

/* ---------- Flip Finder: new cards the bot found with a good flip. You pick which ones move into the site. ---------- */
var finderSel = [], FSENT_KEY = "cfz.finderSent";
/* Passcode gate. Only a scrambled (SHA-256) copy of the code is kept here, never the code itself.
   Once entered on a device it is remembered there, so you only type it once per phone. */
var FLOCK_HASH = "fdd5b3899e0bafccb451bf750e8fa488f8deeda13f860c73b97a2d91e5d88e57", FLOCK_KEY = "cfz.finderOk";
function finderOpen(){ return load(FLOCK_KEY, "") === FLOCK_HASH; }
function sha256hex(t){
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)).then(function(b){
    return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,"0"); }).join(""); });
}
function renderFinderLock(){
  var h = header();
  h += '<form class="flock" id="flock" autocomplete="off"><h2>'+((state.view==="heat"||state.view==="slab")?"Graded Slabs":"Flip Finder")+'</h2><p>Enter the 4-digit passcode to see '+((state.view==="heat"||state.view==="slab")?"the graded slabs that are heating up":"new flip cards")+'.</p>'+
    '<input id="flock-code" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-label="Passcode" autofocus>'+
    '<button class="btn primary" type="submit">Unlock</button><div class="msg" id="flock-msg" role="status"></div></form>';
  root.innerHTML = h;
  bindHeader();
  var f = document.getElementById("flock"), inp = document.getElementById("flock-code"), msg = document.getElementById("flock-msg");
  function tryCode(){
    var v = inp.value.trim(); if(v.length < 4){ msg.textContent = "Enter all 4 digits."; return; }
    sha256hex("cfz-finder:"+v).then(function(x){
      if(x === FLOCK_HASH){ save(FLOCK_KEY, x); render(); }
      else { msg.textContent = "Wrong passcode."; inp.value = ""; inp.focus(); }
    }).catch(function(){ msg.textContent = "This browser can't check the passcode."; });
  }
  f.addEventListener("submit", function(e){ e.preventDefault(); tryCode(); });
  inp.addEventListener("input", function(){ inp.value = inp.value.replace(/\D/g,"").slice(0,4); msg.textContent = ""; if(inp.value.length===4) tryCode(); });
}
state.fsort = "match"; state.fera = ""; state.fclean = false; state.fmsg = "";
var FFLAG = {
  est:["Estimated price","The buy or resell price is TCGplayer's mid price (no recent market price), so it is a softer number."],
  bigjump:["Big price jump","The resell price is about double (or more) what you would pay. Vendors get picky on big jumps like this."],
  wide:["Resell price high vs listings","The resell price is well above the lowest listing. A few high sales may be lifting it, so check the listings."]
};
function finderSentIds(){ var o = load(FSENT_KEY, null); return (o && o.ids && Date.now()-o.at < 6*3600*1000) ? o.ids : []; }
function finderAvail(){
  var have = {}; cards.forEach(function(x){ have[String(x.tcgId||"")+"|"+String(x.tcgVariant||"").toLowerCase()] = 1; });
  var sent = finderSentIds();
  return CANDS.filter(function(c){ return !have[String(c.tcgId||"")+"|"+String(c.tcgVariant||"").toLowerCase()] && sent.indexOf(c.id)<0; });
}
/* Best flip for a candidate at YOUR vendor %, ranked by percentage return (then dollars). */
function fRoute(c){
  var g = condGap(c, "vendor"); if(!g) return null;
  var ok = g.routes.filter(function(r){ return r.net>0; }); if(!ok.length) return null;
  return ok.reduce(function(a,b){ return (b.roi>a.roi || (b.roi===a.roi && b.net>a.net)) ? b : a; });
}
function finderRows(){
  var list = finderAvail().map(function(c){ return {c:c, r:fRoute(c)}; }).filter(function(x){ return x.r; });
  if(state.fera) list = list.filter(function(x){ return x.c.era===state.fera; });
  if(state.fclean) list = list.filter(function(x){ return !(x.c.flags||[]).length; });
  var s = state.fsort;
  list.sort(function(a,b){
    if(s==="roi") return b.r.roi-a.r.roi;
    if(s==="net") return b.r.net-a.r.net;
    if(s==="buy") return a.r.buy-b.r.buy;
    if(s==="new") return String(b.c.found||"").localeCompare(String(a.c.found||"")) || b.r.roi-a.r.roi;
    return (b.c.score||0)-(a.c.score||0);
  });
  return list;
}
function newSince(){ var g = CMETA.generated; if(!g) return "9999"; var d = new Date(g+"T12:00:00"); d.setDate(d.getDate()-3); return d.toISOString().slice(0,10); }
function finderTile(x, picked){

  var eg = condGap(c, "ebay"), e = eg && eg.routes.filter(function(q){ return q.fk===r.fk; })[0];

  return '<div class="tile'+(picked?' picked':'')+'" data-pick="'+esc(c.id)+'" role="checkbox" aria-checked="'+picked+'" tabindex="0"><span class="check" aria-hidden="true">✓</span>'+

    '<div class="froute">Buy '+r.from+' '+money(r.buy)+' → sell '+r.to+' '+money(r.sell)+'</div>'+
    '<div class="fgrid"><div><span>Vendor pays</span><b class="num">'+money(r.sell*S.vendor/100,2)+'</b></div>'+
    '<div><span>Price jump</span><b class="num">'+(r.sell/r.buy).toFixed(1)+'×</b></div>'+
    '<div><span>eBay profit</span><b class="num '+(e&&e.net>=0?'pos-t':'neg-t')+'">'+(e?signed(e.net):'—')+'</b></div></div></div>'+

function sendFinder(add, hide, decline){
  decline = decline || [];
  if(!add.length && !hide.length && !decline.length) return;
  var parts = [];
  if(add.length) parts.push(add.length+" card"+(add.length!==1?"s":""));
  if(decline.length) parts.push("not for me "+decline.length);
  if(hide.length) parts.push("hide "+hide.length);
  var title = "Add candidates: "+parts.join(", ");
  var body = "Sent from the Flip Finder. Press **Create**: the bot updates the list and closes this issue in about a minute.\n\n```json\n"+JSON.stringify({v:1, add:add, decline:decline, hide:hide})+"\n```";
  var base = "https://github.com/"+ADD_REPO+"/issues/new?title="+encodeURIComponent(title)+"&body=";
  var url = base+encodeURIComponent(body);
  if(url.length > 7600){ /* too long for a link: copy it so it can be pasted into the issue */
    copyText(body);
    url = base+encodeURIComponent("Delete this line, then paste (the site copied your picks), then press Create.");
    state.fmsg = "That's a lot of cards, so they were copied instead of filled in. In GitHub, clear the description box, paste, then press Create.";
  } else state.fmsg = (add.length ? "Sent to GitHub. Press Create there; the cards show up in about a minute (refresh this page after)." :
      decline.length ? "Sent to GitHub. Press Create there; those cards stay off the list for 90 days." : "Sent to GitHub. Press Create there to hide them for good.");
  window.open(url, "_blank", "noopener");
  save(FSENT_KEY, {at:Date.now(), ids:add.concat(hide, decline)});   /* hides them here until the list refreshes */
  finderSel = []; render();
}
function goFinder(){ state.view = "finder"; state.selecting = false; selected = []; try{ history.replaceState(null,"","#finder"); }catch(e){} window.scrollTo(0,0); render(); }
function renderFinder(){
  if(!finderOpen()) return renderFinderLock();
  var rows = finderRows(), sent = finderSentIds();
  var eras = Array.from(new Set(finderAvail().map(function(c){ return c.era; }))).filter(Boolean);
  var h = header();
  if(state.notice) h += '<p class="notice" role="status">'+esc(state.notice)+'</p>';

/* ---------- Graded Heat: PSA 10 / 9 slabs of popular Pokémon that look ready to move ----------

   Same passcode as the Flip Finder. */
var HEAT = {data:null, err:"", loading:false, charts:null, chErr:"", chLoading:false};

/* the budget you typed, or the bots' price cap when you haven't typed one */
function htCap(){ return Number(HEAT.data && HEAT.data.budget)||0; }
function htBudget(){ return HT.budget!=null ? (+HT.budget||0) : htCap(); }
var HSTAGE = {
  breaking:["Breaking out","pos","PSA 10 price is rising (+12% or more) but hasn't doubled yet."],
  warming:["Warming up","warnp","Sales are picking up, or this Pokémon's other slabs are rising, while this one's price is still flat. Often the earliest sign."],
  steady:["Steady","","Price about flat."],
  spiked:["Already spiked","neg","PSA 10 already doubled. Buying now is chasing; it can keep going or drop back."],
  cooling:["Cooling","neg","PSA 10 down 12% or more."],
  watching:["First check","","No trend yet. It fills in over the next weeks."],
  quiet:["Quiet","","Fewer than 2 PSA 10 sales in the last week, so the price shown is its usual (median) sale and there's no trend yet."],
  verify:["Verify price","warnp","Looks like it could be moving, but the price behind it isn't confirmed (only one source, a single sale, or an estimate that jumped with no sales behind it). Check eBay sold before buying."],
  conflict:["Check prices","warnp","The price sources disagree and the bot couldn't tell which is right (or PSA 10 came out cheaper than PSA 9), so it isn't trusting the trend. Check eBay sold listings or 130point before buying."]

/* which grade fits your budget: PSA 10 first, PSA 9 if allowed */

  var list = ((HEAT.data && HEAT.data.cards) || []).map(function(c){ return {c:c, fit:htFit(c)}; }).filter(function(x){ return x.fit; });
  if(HT.show==="bets") list = list.filter(function(x){ return x.c.stage!=="spiked" && x.c.stage!=="cooling"; });
  else if(HT.show==="spiked") list = list.filter(function(x){ return x.c.stage==="spiked"; });
  if(HT.era) list = list.filter(function(x){ return (HERA[HT.era]||[]).indexOf(x.c.era)>=0; });
  var q = sFold(HT.q).trim();

  var s = HT.sort;
  list.sort(function(a,b){

/* ---- chart: money (y) over time (x). Line = the bot's price checks (last week's median sale);
   dots = days with sales (average sale that day, bigger dot = more sold); dashed = median over ~4 months. */
var HMON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function htDay(base, n){ var d = new Date(base+"T12:00:00"); d.setDate(d.getDate()+n); return d; }
function htDLabel(d, yr){ return HMON[d.getMonth()]+" "+d.getDate()+(yr?", "+d.getFullYear():""); }
function htNice(lo, hi){
  if(hi<=lo){ hi = lo*1.2+1; lo = lo*0.8; }
  var span = hi-lo, step = Math.pow(10, Math.floor(Math.log10(span/4))), m = span/4/step;
  step *= m>5 ? 10 : m>2 ? 5 : m>1 ? 2 : 1;

function htMoney(v){ return v>=10000 ? "$"+(v/1000).toFixed(v>=100000?0:1).replace(/\.0$/,"")+"K" : money(v,0); }
function htChartHTML(c){
  var g = HTOPEN[c.id] || "g10", lab = g==="g10" ? "PSA 10" : "PSA 9";

  var head = '<div class="ht-ch-top"><b>'+lab+' price &amp; sales</b>'+tabs+'</div>';
  if(!HEAT.charts) return head+'<div class="ht-ch-empty">'+(HEAT.chErr ? 'Couldn’t load the chart ('+esc(HEAT.chErr)+').' : 'Loading chart…')+'</div>';
  var D = (HEAT.charts.cards[c.id]||{})[g], base = HEAT.charts.base;
  if(D && !D.cp) D.cp = [];
  if(!D || (!D.line.length && !D.pts.length && !D.cp.length)) return head+'<div class="ht-ch-empty">No '+lab+' sales tracked yet for this slab.</div>';
  var today = Math.round((Date.now() - new Date(base+"T12:00:00").getTime())/86400000);
  var xs = D.line.map(function(p){ return p[0]; }).concat(D.pts.map(function(p){ return p[0]; }), D.cp.map(function(p){ return p[0]; }));
  var ys = D.line.map(function(p){ return p[1]; }).concat(D.pts.map(function(p){ return p[1]; }), D.cp.map(function(p){ return p[1]; }));
  if(D.ref) ys.push(D.ref[1]);
  var x0 = Math.min.apply(null, xs), x1 = Math.max(today, Math.max.apply(null, xs));
  x0 = Math.min(x0 - 2, x1 - 14);

  var phone = VIEW==="phone", W = phone ? 360 : 640, H = phone ? 230 : 240, L = phone ? 46 : 58, R = 10, T = 14, B = 30;
  function X(d){ return L + (d-x0)/(x1-x0)*(W-L-R); }

  Y.ticks.forEach(function(v){ var y = Yp(v).toFixed(1); s += '<line class="ht-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ht-ax" x="'+(L-8)+'" y="'+y+'" dy="4" text-anchor="end">'+htMoney(v)+'</text>'; });
  var nT = phone ? 2 : 4, multiYr = htDay(base,x0).getFullYear()!==htDay(base,x1).getFullYear();
  for(var i=0;i<=nT;i++){ var d = Math.round(x0+(x1-x0)*i/nT); s += '<text class="ht-ax" x="'+X(d).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===nT?'end':'middle')+'">'+htDLabel(htDay(base,d), multiYr)+'</text>'; }
  s += '<line class="ht-base" x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'"/>';
  if(D.ref){ var ry = Yp(D.ref[1]).toFixed(1); s += '<line class="ht-ref" x1="'+L+'" x2="'+(W-R)+'" y1="'+ry+'" y2="'+ry+'"/><text class="ht-reflab" x="'+(L+4)+'" y="'+ry+'" dy="-5">Median since '+htDLabel(htDay(base,D.ref[0]))+': '+htMoney(D.ref[1])+'</text>'; }
  if(D.cp.length>1) s += '<path class="ht-cpline" d="'+D.cp.map(function(p,i){ return (i?"L":"M")+X(p[0]).toFixed(1)+" "+Yp(p[1]).toFixed(1); }).join("")+'"/>';
  if(D.line.length>1) s += '<path class="ht-line" d="'+D.line.map(function(p,i){ return (i?"L":"M")+X(p[0]).toFixed(1)+" "+Yp(p[1]).toFixed(1); }).join("")+'"/>';
  D.line.forEach(function(p){ s += '<circle class="ht-lpt" cx="'+X(p[0]).toFixed(1)+'" cy="'+Yp(p[1]).toFixed(1)+'" r="4"/>'; });

function htChartBind(box, c){

  var wrap = box.querySelector(".ht-ch-wrap"); if(!wrap) return;

  var svg = wrap.querySelector("svg"), tip = wrap.querySelector(".ht-tip"), cross = svg.querySelector(".ht-cross");
  var pts = {};
  D.line.forEach(function(p){ (pts[p[0]] = pts[p[0]]||{d:p[0]}).m = p[1]; });
  D.pts.forEach(function(p){ var r = (pts[p[0]] = pts[p[0]]||{d:p[0]}); r.a = p[1]; r.n = p[2]; });
  (D.cp||[]).forEach(function(p){ (pts[p[0]] = pts[p[0]]||{d:p[0]}).c = p[1]; });

  var VW = 640;

/* PSA population: 10s / 9s / everything else, gem rate, and how fast the 10s are growing */
function htPop(c){
  var p = c.pop || {};

/* ---------- One slab: every grade's price, pop, and its price history ----------

   (one small download per slab); the bots' own eBay sales checks are drawn on top for PSA 10 / PSA 9. */

  if(SLAB.loading || SLAB.hist || SLAB.err) return;

  var want = SLAB.id;
  function j(u){ return fetch(u).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }); }
  Promise.all([
    c.cpslug ? j(CP_API+"card/"+encodeURIComponent(c.cpslug)).catch(function(){ return null; }) : Promise.resolve(null),
    j(CP_API+"graded-history?cardId="+encodeURIComponent(c.cpid)+"&days=3650&printing=")

/* ---------- Budget picks ----------
   Type how much cash you're bringing. Every card whose flip you can afford (buy price at or under your budget,
   and at or under the per-card cap) is ranked, and a "best mix" picks the set of cards that fits in the budget
   together and makes the most total profit. Profit = what the exit pays for the next condition up, minus the buy. */
var BG_KEY = "cfz.budget";
var BG = Object.assign({amt:200, maxPer:0, exit:"vendor", sort:"roi", routes:{dmg:true, mp:true, lp:true}, noJump:true, under100:false, minBuy:5, shown:30}, load(BG_KEY, {}));
BG.shown = 30;
function bgSave(){ var c = Object.assign({}, BG); delete c.shown; save(BG_KEY, c); }
function bgCap(){ var a = Number(BG.amt)||0, m = Number(BG.maxPer)||0; return m>0 ? Math.min(a, m) : a; }
/* best affordable flip for one card, or null */
function bgPick(c){
  var cap = bgCap(), keep = BG.exit==="vendor" ? S.vendor/100 : 1 - S.ebay/100, best = null;
  FLIPS.forEach(function(f){
    if(!BG.routes[f[0]]) return;
    var bx = c.raw && c.raw[f[0]], sx = c.raw && c.raw[f[1]];
    var b = priceAt(c, f[0]), s = priceAt(c, f[1]);
    if(!(b>0 && s>0) || b > cap || b < (Number(BG.minBuy)||0)) return;
    if(BG.noJump && s >= b*2) return;
    if(BG.under100 && s > 100) return;
    var net = s*keep - b; if(!(net > 0)) return;
    var r = {c:c, fk:f[0], from:f[2], to:f[3], buy:b, sell:s, pay:s*keep, net:net, roi:net/b*100, est:!!((bx&&bx.est)||(sx&&sx.est))};
    if(!best || bgScore(r) > bgScore(best)) best = r;
  });
  return best;
}
function bgScore(r){ return BG.sort==="net" ? r.net : r.roi; }
function bgList(){
  var out = [];
  cards.forEach(function(c){ var r = bgPick(c); if(r) out.push(r); });
  out.sort(function(a,b){ return (bgScore(b)-bgScore(a)) || (b.net-a.net) || title(a.c).localeCompare(title(b.c)); });
  return out;
}
/* Best mix: 0/1 knapsack on the buy prices, maximizing total profit within the budget. */
function bgPlan(list){
  var amt = Number(BG.amt)||0; if(!(amt>0) || !list.length) return {items:[], spend:0, profit:0};
  var step = amt > 2500 ? Math.ceil(amt/2500) : 1, W = Math.floor(amt/step);
  var n = list.length, w = list.map(function(r){ return Math.max(1, Math.ceil(r.buy/step)); });
  var dp = new Float64Array(W+1), take = new Uint8Array((n)*(W+1));
  for(var i=0;i<n;i++){ var wi = w[i], vi = list[i].net, row = i*(W+1);
    for(var x=W; x>=wi; x--){ var v = dp[x-wi]+vi; if(v > dp[x]){ dp[x] = v; take[row+x] = 1; } } }
  var items = [], x = W;
  for(var j=n-1;j>=0;j--){ if(take[j*(W+1)+x]){ items.push(list[j]); x -= w[j]; } }
  items.sort(function(a,b){ return bgScore(b)-bgScore(a); });
  return {items:items, spend:items.reduce(function(t,r){ return t+r.buy; },0), profit:items.reduce(function(t,r){ return t+r.net; },0)};
}
function bgOn(){ return Number(BG.amt) > 0; }

  return '<div class="bg-form">'+

function loadAdmin(force){

/* one feed: bot-log entries, plus Actions runs that left no entry (older runs, crashes, publishes) */
function adminFeed(){
  var log = ADM.log || [], runs = ADM.runs || [], byRun = {}, feed = [], cut = Date.now()-7*86400000;
  log.forEach(function(e){ var id = runIdOf(e.run); if(id) byRun[id] = e;

  var quiet = {pages:{ok:0}, versions:{ok:0}};
  runs.forEach(function(r){
    if(byRun[String(r.id)] || r.conclusion==="skipped") return;
    var bot = botOfRun(r); if(!bot) return;
    var d = new Date(r.run_started_at || r.created_at); if(d.getTime() < cut) return;
    var running = r.status!=="completed", c = r.conclusion;
    var mins = (new Date(r.updated_at) - new Date(r.run_started_at || r.created_at))/60000;
    if(bot==="tcgcheck" && c==="success" && mins < 4) return;            /* wake-ups that weren't this week's slot */
    if((bot==="pages" || bot==="versions") && c==="success"){ quiet[bot].ok++; return; }
    if((bot==="pages" || bot==="versions") && c==="cancelled"){          /* replaced by a newer publish that worked (or is still going) */
      var t0 = new Date(r.created_at).getTime();
      var replaced = runs.some(function(o){ if(o.id===r.id || botOfRun(o)!==bot) return false;
        var dt = new Date(o.created_at).getTime() - t0;

      if(replaced) return;

    else if(c==="cancelled"){ level = "warn"; head = nm+" was cancelled or timed out."; }

  return null;
}
