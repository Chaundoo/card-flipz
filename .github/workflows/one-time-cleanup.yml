name: One-time patch (site + bot updates)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/one_time_cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eras index.html scripts/refresh_prices.py
          git diff --cached --quiet && echo "Nothing to change." || (git commit -m "Add the Add-from-TCGplayer-link button; leave API room for adds" && git push)
