name: One-time cleanup (remove sales counts and sale dates)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/one_time_cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eras index.html
          git diff --cached --quiet && echo "Nothing to change." || (git commit -m "Remove sales counts and sale dates" && git push)
