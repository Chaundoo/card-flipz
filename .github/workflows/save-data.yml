name: Save pairings & profit log

# Runs when you (or a collaborator) open an issue titled "Save data: ..." — the site's
# "Save to GitHub" button fills it in. Issues from anyone else are ignored.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# One save at a time, so two phones saving together can't overwrite each other.
concurrency:
  group: save-data
  cancel-in-progress: false

jobs:
  save:
    if: startsWith(github.event.issue.title, 'Save data') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Save the changes
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retry if the price update or an add-card job saved at the same moment.
          for try in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/save_data.py
            status=$(grep -o 'status=.*' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)
            [ "$status" = "saved" ] || break
            python3 scripts/build_versions.py
            git add pairings.json profitlog.json versions.json
            git diff --cached --quiet && break
            git commit -q -m "Save pairings & profit log (#${{ github.event.issue.number }})"
            if git push -q; then break; fi
            echo "Push raced with another save; retrying ($try)"
            [ "$try" = "3" ] && printf '\n\n⚠️ Could not save after 3 tries because other updates kept saving at the same time. Tap Save to GitHub on the site again.\n' >> run_report.md
            sleep $((try * 10))
          done

      - name: Reply on the issue and close it
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          [ -f run_report.md ] || echo "❌ The save script crashed. Open the Actions run for details." > run_report.md
          echo "" >> run_report.md
          echo "[Run details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> run_report.md
          gh issue comment "$NUM" --body-file run_report.md
          if [ "${{ steps.save.outputs.status }}" = "saved" ]; then
            gh issue close "$NUM" --reason completed
          else
            gh issue close "$NUM" --reason "not planned"
          fi
