name: tcgapi.dev (raw price radar for slabs)

# Raw-price radar from tcgapi.dev's FREE plan (the free plan has no eBay/graded data, so it doesn't price
# slabs). It checks the raw TCGplayer market price of slab-pool cards and its 7 / 30-day change; cards whose raw
# price is rising get checked with real eBay sales first by the Graded Slabs bot and score a little higher.
# Mid-era cards (focus_eras) and slabs heating up go first. Never more than 90 of the free 100 requests per UTC
# day: its own saved count, tcgapi.dev's own counter, and a stop on any rate-limit answer (scripts/tcgapi_bot.py).
# Runs every morning right after CardPrice, then hands off to the pokemon-api.com bot.
# Saves graded/tcgapi.json only. It never changes the site's cards or graded/sources.json.
on:
  workflow_run:
    workflows: ["CardPrice (graded prices, pop counts, price history)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test run: look up and report, save only the request count (still uses requests)"
        type: boolean
        default: false
      cards:
        description: "Max cards to check this run (blank = up to 90). 1-2 requests each; never past 90 a day."
        default: ""

permissions:
  contents: write
  issues: write

# one group for all the slab bots, so they run one at a time (and two tcgapi.dev runs can't overlap)
concurrency:
  group: graded-bots
  cancel-in-progress: false

jobs:
  tcgapi:
    # chain runs only: skip when CardPrice was started by hand (so today's requests aren't spent twice)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check raw prices on tcgapi.dev
        id: run
        continue-on-error: true
        env:
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TA_CARDS: ${{ github.event.inputs.cards || '' }}
        run: python3 scripts/tcgapi_bot.py

      # saved even on test runs, so the day's request count is never lost
      - name: Save tcgapi.dev data and today's request count
        if: always() && steps.run.outputs.saved == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/keep && cp graded/tcgapi.json /tmp/keep/
          for try in 1 2 3 4 5; do
            git add graded/tcgapi.json
            git diff --cached --quiet && { echo "Nothing to save."; break; }
            git commit -q -m "tcgapi.dev $(date -u +%Y-%m-%d): ${{ steps.run.outputs.checked }} raw prices checked"
            if git push -q; then break; fi
            echo "Push raced with another save; retrying ($try)"
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p graded && cp /tmp/keep/tcgapi.json graded/
            sleep $((try * 10))
          done

      - name: Post the result to the "Graded Heat log" issue
        if: always() && (steps.run.outputs.status == 'FAILED' || github.event_name == 'workflow_dispatch' || failure())
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f run_report.md ] || echo "## ❌ The tcgapi.dev bot crashed. Open the Actions run for details." > run_report.md
          echo "" >> run_report.md
          echo "[Run details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> run_report.md
          num=$(gh issue list --state open --limit 100 --json number,title -q '.[] | select(.title=="Graded Heat log") | .number' | head -n 1)
          if [ -z "$num" ]; then
            url=$(gh issue create --title "Graded Heat log" \
              --body "The slab bots post here when something needs a look and whenever you run them by hand.")
            num="${url##*/}"
          fi
          gh issue comment "$num" --body-file run_report.md

      - name: Mark the run as failed if it had problems
        if: steps.run.outcome == 'failure'
        run: |
          echo "Status: ${{ steps.run.outputs.status }} — see the log issue."
          exit 1

      - name: Write to the site's admin log
        if: always()
        env:
          BOT: ta
          JOB_STATUS: ${{ job.status }}
          RUN_STATUS: ${{ steps.run.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
        run: bash scripts/log_run.sh
