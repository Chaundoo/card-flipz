name: Daily price update (TCG Price Lookup)

on:
  schedule:
    # Every day 13:23 UTC = 6:23 am Pacific (5:23 am in winter). Each run updates about 1/7
    # of the cards, oldest first, so every card is refreshed about once a week.
    - cron: "23 13 * * *"
  workflow_dispatch:
    inputs:
      cards:
        description: "How many cards to update this run (0 = the normal daily share)"
        default: "0"
      dry_run:
        description: "Test run: get prices but don't save anything"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Update raw prices from TCG Price Lookup
        id: run
        continue-on-error: true
        env:
          TCGPL_API_KEY: ${{ secrets.TCGPL_API_KEY }}
          DAILY_SHARE: ${{ github.event.inputs.cards || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python3 scripts/refresh_prices.py

      - name: Save the era card files and the log
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eras PRICE_LOG.md scripts/tcgpl_state.json 2>/dev/null || git add eras PRICE_LOG.md
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "Price update $(date -u +%Y-%m-%d) (${{ steps.run.outputs.status }})"
            if ! git push; then
              printf '\n**⚠️ Could not save:** a card file changed on GitHub while this ran (someone uploaded a new copy). Nothing was overwritten. Those cards get picked up again on the next run.\n' >> run_report.md
              exit 1
            fi
          fi

      # GitHub emails you each comment, so only post when something needs a look,
      # plus a Friday summary and any run you start by hand.
      - name: Post the result to the "Price update log" issue
        if: always() && (steps.run.outputs.status != 'OK' || github.event_name == 'workflow_dispatch' || failure())
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f run_report.md ] || echo "## ❌ The update script crashed. Open the Actions run for details." > run_report.md
          echo "" >> run_report.md
          echo "[Run details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> run_report.md
          num=$(gh issue list --state open --limit 100 --json number,title -q '.[] | select(.title=="Price update log") | .number' | head -n 1)
          if [ -z "$num" ]; then
            url=$(gh issue create --title "Price update log" \
              --body "The daily price update posts here when something needs a look, every Friday, and whenever you run it by hand. GitHub emails you each new comment.")
            num="${url##*/}"
          fi
          gh issue comment "$num" --body-file run_report.md

      - name: Friday summary
        if: always() && steps.run.outputs.status == 'OK' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%u)" = "5" ] || exit 0
          echo "" >> run_report.md
          echo "[Run details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · full history in PRICE_LOG.md" >> run_report.md
          num=$(gh issue list --state open --limit 100 --json number,title -q '.[] | select(.title=="Price update log") | .number' | head -n 1)
          if [ -z "$num" ]; then
            url=$(gh issue create --title "Price update log" --body "The daily price update posts here when something needs a look, every Friday, and whenever you run it by hand.")
            num="${url##*/}"
          fi
          gh issue comment "$num" --body-file run_report.md

      - name: Mark the run as failed if the update had problems
        if: steps.run.outcome == 'failure'
        run: |
          echo "Status: ${{ steps.run.outputs.status }} — see the log issue."
          exit 1
